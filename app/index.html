<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GigHerd</title>
<!-- Google tag (gtag.js) — product analytics only (no Vercel/PostHog,
     see 01_Strategy analytics plan). Loaded as high in <head> as
     reasonable so it's ready before any user interaction fires an
     event. trackEvent() wrapper lives in the main script below and
     no-ops safely if gtag hasn't loaded yet (e.g. ad blockers). -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BMYHXEGNHE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-BMYHXEGNHE');
</script>
<!-- Search-engine + share-preview copy — one shared tagline
     ("Line up shows with your pals.") everywhere it appears, same as
     the header/name-gate, rather than writing separate marketing copy
     nobody would notice diverging from the real in-app tagline.
     "GigHerd" (no space) everywhere the brand name appears in <head>
     now too — was "Gig Herd" with a space in the title/OG/Twitter
     tags, inconsistent with the actual wordmark
     (`<span>Gig</span><span>Herd</span>`, no space between). -->
<meta name="description" content="Line up shows with your pals.">
<meta name="theme-color" content="#211f1a">
<link rel="manifest" href="site.webmanifest">
<!-- Favicon — a tight "GH" monogram, same wordmark colors/weight as
     the header (Big Shoulders Display 900, pink "G"/green "H") on the
     app's own charcoal, so the browser tab reads as the same brand as
     the page itself. .ico first (broadest legacy support, includes
     16/32/48px), PNGs after for browsers/platforms that prefer a
     specific size — apple-touch-icon for iOS home-screen bookmarks,
     the 192/512 pair for Android/PWA-style "add to home screen" (also
     referenced by site.webmanifest above, so both paths point at the
     same two files rather than a separate manifest-only set). All
     five generated from one 512px master, not drawn separately, so
     they can't drift out of sync with each other. -->
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<!-- Open Graph / Twitter card — a plain link share preview: the
     wordmark + tagline on the app's own charcoal, same "GigHerd" that
     appears everywhere else, not a screenshot of the UI. Image paths
     are relative, resolved against the page's own URL. Now that the
     app is live at a real domain, og:url and a canonical tag are both
     filled in -- previously left off deliberately since there was no
     real domain yet to hardcode (see git history). Both pin to the
     clean root "https://www.gigherd.com/", not "/index.html" -- same
     "one canonical URL, not two that happen to serve the same page"
     fix as the wordmark link and copyInviteLink() (see .wordmark and
     copyInviteLink() below). Lets share previews and search engines
     treat this as one page instead of two possible URLs for it. -->
<link rel="canonical" href="https://www.gigherd.com/">
<meta property="og:title" content="GigHerd">
<meta property="og:description" content="Line up shows with your pals.">
<meta property="og:site_name" content="GigHerd">
<meta property="og:image" content="assets/og-image.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.gigherd.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="GigHerd">
<meta name="twitter:description" content="Line up shows with your pals.">
<meta name="twitter:image" content="assets/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/grid.css">
<link rel="stylesheet" href="styles/components.css">
<!-- Supabase UMD build — plain global script, not a module, so this
     keeps working when the file is opened directly (file://). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Lucide — the app's standard iconset going forward. Pinned to a
     specific version rather than @latest per Lucide's own docs, so an
     upstream release can't silently change/rename glyphs out from
     under us. Usage: <i data-lucide="name"></i> placeholders, swapped
     for inline SVG by lucide.createIcons() — called once for static
     icons and again after any dynamic render that adds new
     data-lucide elements (see script below). -->
<script src="https://unpkg.com/lucide@1.29.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- ===== Name gate ===== -->
<!-- Shown only when this browser has no person cookie yet — a plain
     on-page form, not a window.prompt(). Header + main stay hidden
     until this is submitted, then init() continues as normal. This
     is the whole "splash page" — no separate marketing screen, just
     the same shell with a name field in front of it. -->
<div id="name-gate" style="display:none;">
  <div class="name-gate-center">
    <div class="name-gate-box">
      <div class="wordmark" style="display: block;"><span class="wordmark-gig">Gig</span><span class="wordmark-herd">Herd</span></div>

      <!-- Step 1: always shown first, same tagline either way. A
           second field (group name) appears only for a cold start —
           no ?g=<slug> in the URL, meaning there's no group to join
           yet, so it's collected in the same form rather than as a
           separate step. -->
      <div id="name-gate-step-name">
        <p class="name-gate-tagline" id="name-gate-tagline">Line up shows with your pals.</p>
        <!-- Invite-link visitors only — the brand tagline above stays put
             either way, this adds the specific "here's what you're
             joining" context underneath it, with real space between the
             two so it doesn't read as one run-on line. -->
        <p class="name-gate-invite-message" id="name-gate-invite-message" style="display:none;"></p>
        <form id="name-gate-form">
          <div class="form-row">
            <label for="name-gate-input">What's your name?</label>
            <input type="text" id="name-gate-input" required placeholder="Your name" autocomplete="name">
          </div>
          <div class="form-row" id="name-gate-group-row" style="display:none;">
            <!-- Label reads "Herd name" now, not "Group name" -- per
                 direct feedback, closing the last gap in "herd"
                 terminology (nav drawer already said "Herds"/"Add a
                 herd"; this and the group modal below were the two
                 remaining spots still saying "group"). id/for stay as
                 name-gate-group-input -- internal, not user-visible. -->
            <label for="name-gate-group-input">Herd name</label>
            <input type="text" id="name-gate-group-input" placeholder="e.g. The Usual Suspects" autocomplete="off">
          </div>
          <button type="submit" class="btn-solid">Continue</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- ===== Header nav ===== -->
<!-- Wired to Supabase — real people/groups/memberships, no more mock
     data. This is the first of three components (header, body
     container, footer) building up on the frame. -->
<header class="site-header" id="site-header">
  <!-- Grid, not flex — a flex-centered wordmark only centers visually
       when both side elements are the same width. Now that the group
       switcher has moved into the drawer (see below), the header's
       right column just sits empty, but the grid's two 1fr side
       columns still stay equal width regardless, so the wordmark
       keeps landing dead center. -->
  <div class="container header-row">
    <!-- Same trigger, same drawer, just an avatar instead of a hamburger
         glyph — "menu" is really "you" here (identity, groups, crew
         all live behind it), so the icon should say that directly. -->
    <button type="button" class="header-avatar-btn" id="hamburger-btn" aria-label="Open menu" aria-expanded="false" aria-controls="nav-drawer">
      <span id="header-avatar-initials"></span>
    </button>
    <!-- "/" not "index.html" -- the relative filename put the literal
         /index.html in the address bar on click, exposing a
         different-looking URL than the clean root visitors normally
         land on (and than copyInviteLink() generates -- see below).
         Absolute root path always resolves to the same page either
         way, so there's no behavior change, just a consistent URL. -->
    <a href="/" class="wordmark"><span class="wordmark-gig">Gig</span><span class="wordmark-herd">Herd</span></a>
  </div>
  <!-- Same one-liner as the name gate, so the value prop shows up
       everywhere the wordmark does, not just the first screen someone
       sees. -->
  <div class="container">
    <p class="header-tagline">Line up shows with your pals.</p>
  </div>
</header>

<!-- ===== Nav drawer ===== -->
<!-- Identity + group switcher — the group switcher moved back in here
     (it briefly lived in the header as a dropdown). Inside a drawer, a
     second click-to-open dropdown was redundant friction (you already
     opened the drawer to get here), so it's a plain always-visible
     list now, not a popover. A Crew section (plain member names) used
     to sit below this and got cut — redundant with the per-show avatar
     stacks and the group switcher's own "N members" subtitle. -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<aside class="nav-drawer" id="nav-drawer" aria-hidden="true">
  <!-- Close button now lives inside the identity section itself (was a
       sibling .drawer-top row above it) so the section's own
       --color-fill-dim band covers the true top of the drawer, flush to
       the top border, instead of stopping short and leaving the close
       button sitting on the lighter drawer surface above it. -->
  <div class="drawer-section drawer-identity-section" id="drawer-identity-section">
    <div class="drawer-top">
      <button type="button" class="drawer-close-btn" id="drawer-close-btn" aria-label="Close menu"><i data-lucide="x"></i></button>
    </div>

    <div class="drawer-identity">
      <!-- Click to reveal the edit panel below (name + color) — was a
           plain non-interactive div; a real button now, since editing
           either of those used to have no entry point at all. -->
      <button type="button" class="drawer-avatar" id="drawer-avatar" aria-label="Edit your name and color" aria-expanded="false"></button>
      <!-- Name + a pencil icon, both clickable — same toggle as the
           avatar. The pencil exists purely so "you can edit this" is
           visible at a glance instead of only discoverable by
           clicking the avatar and hoping. -->
      <button type="button" class="drawer-name-btn" id="drawer-name-btn" aria-label="Edit your name and color" aria-expanded="false">
        <span class="drawer-name" id="drawer-name"></span>
        <i data-lucide="pencil" class="drawer-name-edit-icon"></i>
      </button>
    </div>
    <!-- Hidden until the avatar's clicked — name + color used to sit
         permanently expanded here, which read as more "settings you
         must configure" than the identity block deserved, especially
         now that color is auto-assigned on signup (see AVATAR_COLORS)
         rather than something everyone has to pick themselves. -->
    <div class="drawer-identity-edit" id="drawer-identity-edit" style="display:none;">
      <div class="form-row">
        <label for="drawer-name-input">Your name</label>
        <input type="text" id="drawer-name-input" autocomplete="name">
      </div>
      <!-- A fixed palette, not a free color picker — every option stays
           legible white-on-color both on the light card surface and the
           drawer's charcoal, which an arbitrary color couldn't promise.
           Picking one writes straight to people.avatar_color and
           re-renders every avatar on screen. -->
      <div class="drawer-label">Your color</div>
      <div class="avatar-color-picker" id="avatar-color-picker"></div>
    </div>
  </div>

  <!-- Crew (a plain name list for the current group) lived here and
       got cut — redundant with the per-show avatar stacks and the
       group switcher's own "N members" subtitle, and it was the one
       section in the drawer that didn't actually do anything when
       tapped. -->
  <!-- drawer-section-last added per direct feedback ("remove the
       stroke at the bottom") — this was the only plain .drawer-section
       left with a border-bottom stroke once the identity section moved
       to its own fill-band treatment; the footer below is now locked
       to the drawer's bottom edge (see .drawer-footer-section) rather
       than sitting immediately after this in flow, so the stroke was
       the last leftover divider line in the drawer. -->
  <div class="drawer-section drawer-section-last" id="group-bar" style="display:none;">
    <!-- Cross-group view — everything you've marked curious, across
         every herd you're in, not scoped to whichever one happens to
         be selected right now. Sits above the herd list itself since
         it's not really "one more herd," it's the other way of
         looking at the same shows. -->
    <button type="button" class="drawer-my-shows-btn" id="drawer-my-shows-btn">
      <span class="drawer-my-shows-text">
        <span class="drawer-my-shows-label">My Shows</span>
        <span class="drawer-my-shows-sub">Everything you've marked, across your herds</span>
      </span>
      <!-- Same --space-32 circular hit-area as .drawer-group-share
           (the per-group share icon) — the bare chevron alone read
           misaligned/oddly spaced next to it, since it had no matching
           circle giving it the same visual footprint. -->
      <span class="drawer-my-shows-arrow-circle">
        <i data-lucide="chevron-right"></i>
      </span>
    </button>
    <!-- "Your groups" -> "Herds" per direct feedback: lean into the
         app's own name/metaphor instead of the generic term. "Group"
         used to still show up at the name-gate ("Group name") and in
         the group modal ("View group"/"Leave group") -- a later pass
         ("make sure herd is consistent across") caught those too, see
         name-gate-group-row and #group-view-btn/#group-modal-leave-btn
         below. Internal ids/classes/functions (group.name, .group-
         modal-*, createGroup(), etc.) are deliberately untouched --
         this is a copy pass, not a data-model rename. -->
    <div class="drawer-label">Herds</div>
    <div class="drawer-group-list" id="drawer-group-list"></div>
    <!-- Same visual weight as Add Show's own card now, per direct
         feedback — a real surface, centered icon + label, not a quiet
         row-shaped button underneath the list. Label reads "Add a
         herd" now, not "+ Herd" — per direct feedback ("plus herd is
         confusing"), matching Add Show's own "+" icon + "Add a show"
         label pattern exactly, rather than a shorthand that read
         ambiguous next to the icon. -->
    <button type="button" class="drawer-new-group-btn" id="drawer-new-group-btn">
      <span class="drawer-new-group-icon">+</span>
      <span>Add a herd</span>
    </button>
  </div>

  <!-- Copyright + contact — used to be a standalone page footer,
       moved in here per direct feedback. Now locked to the drawer's
       own bottom edge (position:absolute, 48px up, centered) instead
       of sitting in normal flow at the end of the section list, so it
       reads as a fixed sign-off rather than "the last thing you
       scroll to." Reuses .drawer-label's quiet small-print register
       rather than the old page-footer's own (now-removed) styling.
       Contact link reworded from a bare "Contact" to an actual prompt
       per direct feedback. -->
  <div class="drawer-footer-section">
    <p class="drawer-footer-copyright">© 2026 GigHerd</p>
    <!-- Real support address now, not a personal inbox — shown outright
         rather than hidden behind generic link text, per direct
         feedback ("i think we show the email"). -->
    <p class="drawer-footer-prompt">Questions or comments?</p>
    <a class="drawer-footer-contact" href="mailto:hello@gigherd.com">hello@gigherd.com</a>
  </div>
</aside>

<!-- ===== Body container ===== -->
<!-- Show cards for the current group's shows — real data, wired to
     Supabase. Curious/out buttons write to the responses table
     immediately on click. -->
<main class="container show-list" id="main-content">
  <!-- Which group am I looking at — the one thing that was missing
       once the secondary action moved out of the Add Show row (see
       below). A real heading, not a button pretending to be one:
       group name on the left, two small icon-only circular actions on
       the right (share the invite link directly; view the group —
       member list + leave, in the existing group modal). Visible on
       both tabs, unlike Add Show — knowing which group you're in
       isn't a Herd-Picks-only concern. -->
  <div class="group-heading-row" id="group-heading-row" style="display:none;">
    <h2 class="group-heading-name" id="group-heading-name"></h2>
    <div class="group-heading-actions">
      <button type="button" class="group-heading-btn" id="group-share-btn" aria-label="Share invite link">
        <i data-lucide="share"></i>
      </button>
      <button type="button" class="group-heading-btn" id="group-view-btn" aria-label="View herd">
        <i data-lucide="users"></i>
      </button>
    </div>
  </div>

  <!-- My Shows — cross-group view, reuses .group-heading-row's h2
       styling (same visual weight as "which group am I in") but with
       no actions, since there's no single group here to share/view. -->
  <div class="group-heading-row" id="my-shows-heading-row" style="display:none;">
    <h2 class="group-heading-name">My Shows</h2>
  </div>

  <!-- Add show — one card, always, full width again now that the
       group menu moved to the heading row above. It doesn't hand off
       to a second box when it opens; the same card grows/shrinks
       vertically in place (CSS grid-rows trick — see .add-show-panel/
       .is-open in components.css), toggled by the one button in its
       header. The "+" rotates 45° into an "×" on open (pure CSS
       transform), so that button is both the open and close control. -->
  <div id="add-show-card" class="add-show-card" style="display:none;">
    <button type="button" id="add-show-btn" class="add-show-toggle">
      <span class="add-show-icon" id="add-show-icon">+</span>
      <span class="add-show-label">Add a show</span>
    </button>

      <div id="add-show-panel" class="add-show-panel">
        <div class="add-show-panel-inner">
        <div class="add-show-panel-content">
        <!-- Method 1: search by artist name (Ticketmaster, New England) -->
        <div class="form-row" id="search-method-row">
          <label for="artist-search-input">Search artist</label>
          <div class="inline-input-row">
            <input type="text" id="artist-search-input" placeholder="Artist or show name">
            <button type="button" id="artist-search-btn" class="btn-solid">Search</button>
          </div>
          <div id="artist-search-status" class="autofill-status"></div>
          <div id="artist-search-results" class="search-results" style="display:none;"></div>
        </div>

        <div class="add-show-alt-methods">
          <button type="button" id="show-manual-method-btn" class="link-btn">or add manually</button>
        </div>

        <!-- Method 2: manual fields — also the fallback when search
             doesn't return a usable title+date. When it does, the show
             gets created straight from that data with no form shown at
             all (see submitShowDirectly in the script below). The
             "paste a link" method was cut — one fewer entry point,
             search covers the common case. -->
        <form id="add-show-form" style="display:none;">
          <div class="form-row">
            <label for="show-title">Show</label>
            <input type="text" id="show-title" required placeholder="Artist / show title">
          </div>
          <div class="form-row">
            <label for="show-date-input">Date</label>
            <input type="date" id="show-date-input" required>
          </div>
          <div class="form-row">
            <label for="show-venue-name">Venue</label>
            <input type="text" id="show-venue-name" placeholder="Venue name" autocomplete="off">
            <div id="venue-search-results" class="search-results" style="display:none;"></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-solid">Add show</button>
            <button type="button" id="cancel-add-show" class="btn-outline">Cancel</button>
          </div>
        </form>
      </div>
      </div>
    </div>
  </div>

  <!-- Initial-fetch state only — always gets replaced by renderShows()
       or renderEmptyState() once data comes back, so it's its own
       .show-list-loading class rather than reusing .show-list-empty
       (a real "no shows" state and a few-hundred-ms fetch state
       shouldn't share styling just because both are momentarily
       contentless). Hand-authored spinner SVG, same reasoning as the
       empty-state guitar icon above — no dependency on an icon font
       resolving. -->
  <div id="show-list-content" class="show-list-loading">
    <div class="show-list-loading-icon">
      <svg viewBox="0 0 50 50" aria-hidden="true">
        <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 150"/>
      </svg>
    </div>
  </div>
</main>

<!-- ===== Who's in a group — avatar + name for everyone in either
     response group, opened by clicking the group on a show card. Same
     flat overlay language as the nav drawer's scrim. ===== -->
<div class="modal-overlay" id="people-modal-overlay" style="display:none;">
  <div class="modal-box" id="people-modal-box">
    <div class="modal-top">
      <div class="modal-title" id="people-modal-title"></div>
      <button type="button" class="modal-close-btn" id="people-modal-close-btn" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div class="person-list" id="people-modal-list"></div>
  </div>
</div>

<!-- ===== Group modal — opened from the secondary action beside Add
     Show. Invite at the top (the most common reason to open this),
     the member list in the middle (answers "who's actually in this
     group," not just "who's responded to a show"), Leave group quiet
     and last (a real but infrequent action — bottom-of-sheet, plain
     text, not a filled/red button; this app has no destructive-red
     token anywhere and one rare action didn't seem worth introducing
     one for). Confirms via a plain window.confirm() before leaving —
     same "reach for the browser's own primitive before building custom
     chrome" approach already used for the clipboard-copy fallback. ===== -->
<div class="modal-overlay" id="group-modal-overlay" style="display:none;">
  <div class="modal-box" id="group-modal-box">
    <div class="modal-top">
      <!-- Name + pencil, same toggle-to-edit pattern as the drawer's
           own .drawer-name-btn — click to reveal the plain text input
           below. Any member can rename the herd (groups have no owner
           concept — see schema.sql), same as any member can already
           leave it. -->
      <button type="button" class="group-modal-title-btn" id="group-modal-title-btn" aria-label="Edit herd name" aria-expanded="false">
        <span class="modal-title" id="group-modal-title"></span>
        <i data-lucide="pencil" class="group-modal-title-edit-icon"></i>
      </button>
      <button type="button" class="modal-close-btn" id="group-modal-close-btn" aria-label="Close"><i data-lucide="x"></i></button>
    </div>

    <!-- Hidden until the title's clicked — collapsed by default, same
         reasoning as .drawer-identity-edit: opening it should always
         start from the current name, not whatever was left typed in
         last time. -->
    <div class="group-modal-name-edit" id="group-modal-name-edit" style="display:none;">
      <div class="form-row">
        <label for="group-modal-name-input">Herd name</label>
        <input type="text" id="group-modal-name-input" autocomplete="off">
      </div>
    </div>

    <button type="button" class="btn-solid group-modal-invite-btn" id="group-modal-invite-btn">
      <i data-lucide="share"></i>
      <span>Invite people</span>
    </button>

    <div class="group-modal-label">Members</div>
    <div class="person-list" id="group-modal-member-list"></div>

    <button type="button" class="group-modal-leave-btn" id="group-modal-leave-btn">Leave herd</button>
  </div>
</div>

<!-- ===== New herd — used to be a bare window.prompt(), which per
     direct feedback "feels weird" (native browser chrome, no scrim,
     inconsistent look across Safari/Chrome). Same modal-overlay/
     modal-box pattern as the group and people modals above, so it
     picks up the app's own flat scrim and surface styling instead of
     falling back to the OS's own dialog box. ===== -->
<div class="modal-overlay" id="new-group-modal-overlay" style="display:none;">
  <div class="modal-box" id="new-group-modal-box">
    <div class="modal-top">
      <div class="modal-title">New herd</div>
      <button type="button" class="modal-close-btn" id="new-group-modal-close-btn" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <form id="new-group-form">
      <div class="form-row">
        <label for="new-group-input">Herd name</label>
        <input type="text" id="new-group-input" required placeholder="e.g. The Jimmys" autocomplete="off">
      </div>
      <button type="submit" class="btn-solid new-group-submit-btn">Create herd</button>
    </form>
  </div>
</div>

<!-- The page footer that used to live here (copyright + a mailto:
     contact link) moved into the nav drawer per direct feedback — see
     .drawer-footer-section at the bottom of #nav-drawer above. Contact
     is still a bare mailto: link, not a form — there's no email
     service or backend for one in this app's stack, and a link that
     just opens your own mail client doesn't need one. -->

<!-- Plain scripts, not modules — see supabase/client.js for why.
     Load order matters: client.js defines OTR.db before identity.js
     and shows.js use it. -->
<script src="supabase/client.js"></script>
<script src="scripts/identity.js"></script>
<script src="scripts/shows.js"></script>
<script>
  const { getPerson, createPerson, getMyGroups, getGroupMembers, getGroupMemberCounts, createGroup, getGroupBySlug, joinGroup, leaveGroup, updatePersonColor, updatePersonName, updateGroupName } = OTR;
  const { getShowsForGroup, getResponsesForShows, setResponse, createShow, searchShows, searchVenues } = OTR;

  // Thin GA4 wrapper — every product event in the app funnels through
  // here rather than calling gtag() directly, so there's one place to
  // see the full event list and one place that no-ops safely if gtag
  // never loaded (ad blockers, offline). Events are named after the
  // underlying data (curious/out status, etc.), not on-screen button
  // copy, so UI wording can keep changing without breaking historical
  // data. See 01_Strategy's analytics plan for the full taxonomy and
  // why overlap_reached (the north star) only fires once per show.
  function trackEvent(name, params) {
    if (typeof gtag !== 'function') return;
    gtag('event', name, params || {});
  }

  const nameGate = document.getElementById('name-gate');
  const nameGateForm = document.getElementById('name-gate-form');
  const nameGateStepName = document.getElementById('name-gate-step-name');
  const nameGateGroupRow = document.getElementById('name-gate-group-row');

  // Captured once at load, before handleGroupJoinFromUrl strips the
  // ?g= param — decides which name-gate path to show (joining a
  // group that already exists vs. a cold start with none yet).
  const inviteSlug = new URLSearchParams(window.location.search).get('g');
  const hasInviteSlug = !!inviteSlug;
  const nameGateInviteMessage = document.getElementById('name-gate-invite-message');
  const siteHeader = document.getElementById('site-header');
  const mainContent = document.getElementById('main-content');

  const groupHeadingRow = document.getElementById('group-heading-row');
  const groupHeadingName = document.getElementById('group-heading-name');
  const groupShareBtn = document.getElementById('group-share-btn');
  const groupViewBtn = document.getElementById('group-view-btn');
  const myShowsHeadingRow = document.getElementById('my-shows-heading-row');
  const listContent = document.getElementById('show-list-content');

  const peopleModalOverlay = document.getElementById('people-modal-overlay');
  const peopleModalTitle = document.getElementById('people-modal-title');
  const peopleModalList = document.getElementById('people-modal-list');
  const peopleModalCloseBtn = document.getElementById('people-modal-close-btn');

  const groupModalOverlay = document.getElementById('group-modal-overlay');
  const groupModalTitle = document.getElementById('group-modal-title');
  const groupModalTitleBtn = document.getElementById('group-modal-title-btn');
  const groupModalNameEdit = document.getElementById('group-modal-name-edit');
  const groupModalNameInput = document.getElementById('group-modal-name-input');
  const groupModalCloseBtn = document.getElementById('group-modal-close-btn');
  const groupModalInviteBtn = document.getElementById('group-modal-invite-btn');
  const groupModalMemberList = document.getElementById('group-modal-member-list');
  const groupModalLeaveBtn = document.getElementById('group-modal-leave-btn');

  const newGroupModalOverlay = document.getElementById('new-group-modal-overlay');
  const newGroupModalCloseBtn = document.getElementById('new-group-modal-close-btn');
  const newGroupForm = document.getElementById('new-group-form');
  const newGroupInput = document.getElementById('new-group-input');

  // Nav drawer — identity + whole-crew list. Group switching lives in
  // the always-visible group bar under the header instead (see below).
  const hamburgerBtn = document.getElementById('hamburger-btn');
  const headerAvatarInitials = document.getElementById('header-avatar-initials');
  const avatarColorPicker = document.getElementById('avatar-color-picker');
  const drawerOverlay = document.getElementById('drawer-overlay');
  const navDrawer = document.getElementById('nav-drawer');
  const drawerIdentitySection = document.getElementById('drawer-identity-section');
  const drawerCloseBtn = document.getElementById('drawer-close-btn');
  const drawerAvatar = document.getElementById('drawer-avatar');
  const drawerName = document.getElementById('drawer-name');
  const drawerNameBtn = document.getElementById('drawer-name-btn');
  const drawerIdentityEdit = document.getElementById('drawer-identity-edit');
  const drawerNameInput = document.getElementById('drawer-name-input');

  // Group list — lives inside the drawer now (was a header dropdown).
  const groupBar = document.getElementById('group-bar');
  const drawerGroupList = document.getElementById('drawer-group-list');
  const drawerNewGroupBtn = document.getElementById('drawer-new-group-btn');
  const drawerMyShowsBtn = document.getElementById('drawer-my-shows-btn');

  const addShowCard = document.getElementById('add-show-card');
  const addShowBtn = document.getElementById('add-show-btn');
  const addShowPanel = document.getElementById('add-show-panel');
  const addShowForm = document.getElementById('add-show-form');
  const cancelAddShow = document.getElementById('cancel-add-show');

  // One card the whole time — `.is-open` on the outer card is what
  // drives both the icon's 45° rotation and the panel's grow/shrink
  // (a CSS grid-rows trick, 0fr closed → 1fr open — see .add-show-panel
  // in components.css), so opening/closing reads as this one card
  // animating, not a second box appearing underneath it.
  function openAddShowModal() {
    addShowCard.classList.add('is-open');
    addShowCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function closeAddShowModal() {
    addShowCard.classList.remove('is-open');
  }

  const artistSearchInput = document.getElementById('artist-search-input');
  const artistSearchBtn = document.getElementById('artist-search-btn');
  const artistSearchStatus = document.getElementById('artist-search-status');
  const artistSearchResults = document.getElementById('artist-search-results');

  const showManualMethodBtn = document.getElementById('show-manual-method-btn');

  const venueNameInput = document.getElementById('show-venue-name');
  const venueSearchResults = document.getElementById('venue-search-results');

  let currentGroupId = null;
  let currentGroup = null;
  let myGroups = [];
  let selectedVenueUrl = null;
  let selectedSourceUrl = null;
  let venueSearchTimer = null;

  function initials(name) {
    return name.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  // Shared invite-link logic — was duplicated inline on the name-gate's
  // "Copy invite link" button; now the one place any share control
  // (the group heading row, each drawer group row, the group modal)
  // builds the link and writes it to the clipboard. Placeholder
  // ?g=<slug> link structure — real domain/slug work comes later once
  // a real URL domain is set up; this just reuses what already
  // existed. Returns whether the clipboard write succeeded, so
  // callers can show their own success feedback (a text swap on the
  // group modal's invite button, a brief icon swap on icon-only
  // buttons) without duplicating the try/catch here.
  //
  // Copies a full sentence, not just the bare URL — a raw link pasted
  // into a text thread carries no context on its own about what it
  // even is. `groupName` is required (every current call site already
  // has the group object in hand) so the message can name the actual
  // group, not just the app in the abstract. Voice matches the app's
  // own tagline everywhere else — direct, no exclamation points, no
  // manufactured urgency (see brand-brief.md's Voice section).
  async function copyInviteLink(slug, groupName, groupId) {
    // "/" not window.location.pathname -- pathname reflects whatever
    // URL the sharer happens to be on (e.g. "/index.html" after
    // clicking the wordmark, or a stale cached hit), which produced
    // inconsistent, ugly invite links depending on where someone was
    // standing when they hit share. The invite always points at the
    // same single-page app either way, so it should always look the
    // same too -- hardcoded to the clean root path.
    const link = `${window.location.origin}/?g=${slug}`;
    const message = `Join ${groupName} on GigHerd — line up shows with your pals: ${link}`;
    trackEvent('invite_sent', { group_id: groupId || null });
    try {
      await navigator.clipboard.writeText(message);
      return true;
    } catch {
      window.prompt('Copy this invite message:', message);
      return false;
    }
  }

  // Brief checkmark swap for icon-only share buttons (no text label to
  // swap to "Copied!" the way the name-gate button does). Re-runs
  // lucide.createIcons() scoped to the button itself so only its one
  // icon gets replaced, not the whole page.
  function flashShareSuccess(btn) {
    btn.innerHTML = '<i data-lucide="check"></i>';
    lucide.createIcons({ root: btn });
    setTimeout(() => {
      btn.innerHTML = '<i data-lucide="share"></i>';
      lucide.createIcons({ root: btn });
    }, 1500);
  }

  // Fixed palette for avatar dots — not a free color picker. Pink is
  // deliberately excluded; it stays reserved for overlap/logo/hover
  // (see tokens.css). First entry, "Paper," used to be the automatic
  // default for everyone — meaning every new person showed up looking
  // identical until they thought to go pick a color themselves, which
  // in practice most people never did. New signups now get a random
  // color from the other seven right away (see randomAvatarColor,
  // called from the name-gate submit handler) — everyone's actually
  // distinguishable from the first show card they see, and "Your
  // color" in the drawer becomes a real edit, not a first-run chore.
  // Paper stays in the palette as a manual pick, just not the default.
  //
  // The other seven are tuned to the logo's own tone/value — same
  // saturation (~54%) and lightness (~51%) as --color-logo-green —
  // just spread across different hues, so every avatar color reads as
  // a sibling of the logo instead of an unrelated grab-bag (the old
  // set mixed muted teal/slate/wine/mustard tones that didn't share
  // any register with the wordmark). Green's own hue and the whole
  // pink range are skipped so no swatch gets mistaken for the logo or
  // the overlap marker.
  const AVATAR_COLORS = [
    { hex: '#ebe8e1', name: 'Paper' },
    { hex: '#c66c3f', name: 'Rust' },
    { hex: '#c6a43f', name: 'Amber' },
    { hex: '#c53fb4', name: 'Berry' },
    { hex: '#3fc6a4', name: 'Jade' },
    { hex: '#3fa4c6', name: 'Sky' },
    { hex: '#3f56c6', name: 'Indigo' },
    { hex: '#773fc6', name: 'Violet' },
  ];

  function avatarColor(p) {
    return (p && p.avatar_color) || AVATAR_COLORS[0].hex;
  }

  // Random pick from everything but Paper (index 0) — used once, at
  // signup, so a fresh person doesn't start out looking like everyone
  // else's unedited default.
  function randomAvatarColor() {
    const pool = AVATAR_COLORS.slice(1);
    return pool[Math.floor(Math.random() * pool.length)].hex;
  }

  // Picking a single fixed text color for every avatar dot doesn't
  // work once "Paper" (near-white) is in the palette alongside dark
  // swatches like Wine or Graphite — white-on-white and charcoal-on-
  // charcoal are both real failure cases. This computes perceived
  // luminance per swatch and returns whichever of charcoal/white
  // actually reads on top of it.
  function contrastTextFor(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? '#211f1a' : '#ffffff';
  }

  // Plain row of avatar dots, each filled with that person's own
  // chosen color (see AVATAR_COLORS) instead of a uniform charcoal, so
  // who's who is legible at a glance. No click-to-expand here anymore
  // — that's now a shared modal opened at the group level (see
  // buildResponseGroup/openPeopleModal below), not a per-stack dropdown.
  function buildAvatarDots(people) {
    const dots = document.createElement('div');
    dots.className = 'avatar-dots';
    people.forEach((p) => {
      const dot = document.createElement('div');
      dot.className = 'avatar-dot';
      const color = avatarColor(p);
      dot.style.background = color;
      dot.style.color = contrastTextFor(color);
      dot.textContent = initials(p.display_name);
      dots.appendChild(dot);
    });
    return dots;
  }

  // Shared avatar + name row builder — used by both the who's-in-this-
  // response-group modal (below) and the group modal's member list, so
  // the two don't drift into two slightly different "list of people"
  // implementations.
  function renderPersonList(container, people) {
    container.innerHTML = '';
    people.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'person-list-item';

      const dot = document.createElement('div');
      dot.className = 'avatar-dot';
      const color = avatarColor(p);
      dot.style.background = color;
      dot.style.color = contrastTextFor(color);
      dot.textContent = initials(p.display_name);
      item.appendChild(dot);

      const name = document.createElement('div');
      name.textContent = p.display_name;
      item.appendChild(name);

      container.appendChild(item);
    });
  }

  // Who's in a group — avatar + name rows in a modal, opened by
  // clicking either response group on a show card (see
  // buildResponseGroup). Same list for every group; only the title and
  // people differ per call.
  function openPeopleModal(title, people) {
    peopleModalTitle.textContent = title;
    renderPersonList(peopleModalList, people);
    peopleModalOverlay.style.display = 'flex';
  }

  function closePeopleModal() {
    peopleModalOverlay.style.display = 'none';
  }

  peopleModalCloseBtn.addEventListener('click', closePeopleModal);
  peopleModalOverlay.addEventListener('click', (e) => {
    if (e.target === peopleModalOverlay) closePeopleModal();
  });

  // Group modal — the current group's own management surface: invite,
  // full member list (not just who's responded to a show), leave.
  // Opened from the "view" icon in .group-heading-row.
  async function openGroupModal() {
    if (!currentGroup) return;
    groupModalTitle.textContent = currentGroup.name;
    setGroupNameEditOpen(false);
    const members = await getGroupMembers(currentGroup.id);
    renderPersonList(groupModalMemberList, members);
    groupModalOverlay.style.display = 'flex';
  }

  function closeGroupModal() {
    groupModalOverlay.style.display = 'none';
  }

  // Same toggle-to-edit shape as setIdentityEditOpen/toggleIdentityEdit
  // below — opening always starts from the current name rather than
  // whatever was left typed in from last time.
  function setGroupNameEditOpen(open) {
    groupModalNameEdit.style.display = open ? 'block' : 'none';
    groupModalTitleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) groupModalNameInput.value = currentGroup.name;
  }

  function toggleGroupNameEdit() {
    const isOpen = groupModalNameEdit.style.display !== 'none';
    setGroupNameEditOpen(!isOpen);
    if (!isOpen) groupModalNameInput.focus();
  }

  // Saves on blur, not on every keystroke — Enter just blurs, same
  // "commit on leave" pattern as the drawer's own name field.
  // Mutates currentGroup directly rather than refetching: currentGroup
  // is the same object reference sitting inside myGroups (selectGroup
  // is always called with an element from that array), so this also
  // keeps the drawer's group switcher in sync once it's re-rendered.
  async function saveGroupNameIfChanged() {
    const newName = groupModalNameInput.value.trim();
    if (!newName || newName === currentGroup.name) {
      groupModalNameInput.value = currentGroup.name;
      return;
    }
    const ok = await updateGroupName(currentGroup.id, newName);
    if (!ok) return;
    currentGroup.name = newName;
    groupModalTitle.textContent = newName;
    groupHeadingName.textContent = newName;
    await renderGroupSwitcher(myGroups);
  }

  groupModalTitleBtn.addEventListener('click', toggleGroupNameEdit);
  groupModalNameInput.addEventListener('blur', saveGroupNameIfChanged);
  groupModalNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      groupModalNameInput.blur();
    }
  });

  // "View" in the group heading row opens the group modal (member list
  // + leave — invite lives there too, redundant with the direct share
  // button below, but harmless to have in both places).
  groupViewBtn.addEventListener('click', openGroupModal);
  groupModalCloseBtn.addEventListener('click', closeGroupModal);
  groupModalOverlay.addEventListener('click', (e) => {
    if (e.target === groupModalOverlay) closeGroupModal();
  });

  // "Share" in the group heading row — a direct one-tap copy, no
  // modal in the way, same pattern as the drawer's per-group share
  // icons (icon flashes to a check on success instead of a text swap,
  // since there's no label here to swap).
  groupShareBtn.addEventListener('click', async () => {
    if (!currentGroup) return;
    const ok = await copyInviteLink(currentGroup.slug, currentGroup.name, currentGroup.id);
    if (ok) flashShareSuccess(groupShareBtn);
  });

  // Invite, from inside the group modal — same shared copyInviteLink()
  // helper every other share affordance uses. Has a real text label
  // (unlike the icon-only share buttons elsewhere), so success is a
  // text swap, same pattern as the name-gate's own "Copy invite link".
  groupModalInviteBtn.addEventListener('click', async () => {
    const ok = await copyInviteLink(currentGroup.slug, currentGroup.name, currentGroup.id);
    if (!ok) return;
    const label = groupModalInviteBtn.querySelector('span');
    const original = label.textContent;
    label.textContent = 'Copied!';
    setTimeout(() => { label.textContent = original; }, 1500);
  });

  // Leave group — confirms first (window.confirm(), same "reach for
  // the browser's own primitive" approach as the clipboard fallback
  // elsewhere), then removes the membership, drops the group from
  // myGroups, and either lands on the next remaining group or falls
  // back to the same zero-groups empty state afterPerson() shows a
  // brand-new person.
  groupModalLeaveBtn.addEventListener('click', async () => {
    if (!currentGroup) return;
    const confirmed = window.confirm(`Leave ${currentGroup.name}? You can rejoin later with an invite link.`);
    if (!confirmed) return;

    const left = await leaveGroup(person.id, currentGroup.id);
    if (!left) return;

    closeGroupModal();
    myGroups = myGroups.filter((g) => g.id !== currentGroup.id);

    if (myGroups.length === 0) {
      currentGroup = null;
      currentGroupId = null;
      drawerGroupList.innerHTML = '';
      groupBar.style.display = 'none';
      groupHeadingRow.style.display = 'none';
      addShowCard.style.display = 'none';
      renderEmptyState(document.getElementById('show-list-content'), 'No groups yet.');
      return;
    }

    await selectGroup(myGroups[0]);
  });

  // New herd modal — opened from the drawer's "+ Herd" button (see
  // handleNewGroup below), replacing what used to be a bare
  // window.prompt(). Same open/close/overlay-click/Escape conventions
  // as the group and people modals above.
  function openNewGroupModal() {
    newGroupInput.value = '';
    newGroupModalOverlay.style.display = 'flex';
    newGroupInput.focus();
  }

  function closeNewGroupModal() {
    newGroupModalOverlay.style.display = 'none';
  }

  newGroupModalCloseBtn.addEventListener('click', closeNewGroupModal);
  newGroupModalOverlay.addEventListener('click', (e) => {
    if (e.target === newGroupModalOverlay) closeNewGroupModal();
  });

  newGroupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = newGroupInput.value.trim();
    if (!name) return;
    closeNewGroupModal();
    const group = await createGroup(person.id, name);
    if (!group) return;
    trackEvent('group_created', { group_id: group.id });
    myGroups = await getMyGroups(person.id);
    await selectGroup(group);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (peopleModalOverlay.style.display === 'flex') closePeopleModal();
    if (groupModalOverlay.style.display === 'flex') closeGroupModal();
    if (newGroupModalOverlay.style.display === 'flex') closeNewGroupModal();
  });

  // Group list — lives inside the drawer, plain always-visible rows
  // (not a dropdown; that got tried in the header and then moved back
  // here, where a second click-to-open step was redundant on top of
  // already opening the drawer). Active group gets a tonal highlight,
  // never the pink accent, which stays reserved for overlap and
  // nowhere else. Each row shows a small "N members" subtitle. Re-run
  // any time groups or the current group changes.
  async function renderGroupSwitcher(groups) {
    const counts = await getGroupMemberCounts(groups.map((g) => g.id));

    drawerGroupList.innerHTML = '';
    groups.forEach(g => {
      // Row is a plain div now, not a button — it needs to hold two
      // independent controls (select group / share that group's
      // invite link), and a button can't contain a nested button.
      // The row keeps the card shape (border, radius, padding) that
      // used to live on the button itself.
      const row = document.createElement('div');
      row.className = 'drawer-group-row';
      if (g.id === currentGroupId) row.classList.add('active');

      const selectBtn = document.createElement('button');
      selectBtn.type = 'button';
      selectBtn.className = 'drawer-group-select';

      const name = document.createElement('span');
      name.className = 'group-switch-item-name';
      name.textContent = g.name;
      selectBtn.appendChild(name);

      const count = counts[g.id] || 0;
      const subtitle = document.createElement('span');
      subtitle.className = 'group-switch-item-count';
      subtitle.textContent = `${count} member${count === 1 ? '' : 's'}`;
      selectBtn.appendChild(subtitle);

      selectBtn.addEventListener('click', () => selectGroup(g));
      row.appendChild(selectBtn);

      const shareBtn = document.createElement('button');
      shareBtn.type = 'button';
      shareBtn.className = 'drawer-group-share';
      shareBtn.setAttribute('aria-label', `Share invite link for ${g.name}`);
      shareBtn.innerHTML = '<i data-lucide="share"></i>';
      shareBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const ok = await copyInviteLink(g.slug, g.name, g.id);
        if (ok) flashShareSuccess(shareBtn);
      });
      row.appendChild(shareBtn);

      drawerGroupList.appendChild(row);
    });

    lucide.createIcons({ root: drawerGroupList });
  }

  drawerNewGroupBtn.addEventListener('click', handleNewGroup);

  async function selectGroup(group) {
    currentGroup = group;
    currentGroupId = group.id;
    myShowsHeadingRow.style.display = 'none';
    groupBar.style.display = 'block';
    drawerMyShowsBtn.classList.remove('active');
    await renderGroupSwitcher(myGroups);
    closeDrawer();
    groupHeadingName.textContent = group.name;
    groupHeadingRow.style.display = 'flex';
    await renderCurrentView(group.id);
  }

  let person = null;

  function formatDate(dateStr, timeStr) {
    const d = new Date(`${dateStr}T${timeStr || '00:00'}`);
    const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
    if (!timeStr) return date;
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return `${date} · ${time}`;
  }

  // Single fetch per group — shared by the group view and (via
  // renderMyShowsView's parallel calls) the cross-group My Shows view,
  // so both always read from the same underlying data.
  async function loadGroupData(groupId) {
    const shows = await getShowsForGroup(groupId);
    const showIds = shows.map((s) => s.id);
    const responsesByShow = await getResponsesForShows(showIds);
    return { shows, responsesByShow };
  }

  // The full group list, unfiltered — used to also branch on a
  // Herd Picks / My Shows tab (a client-side filter to "shows I've
  // marked curious," scoped to just this group), cut once the
  // cross-group My Shows view (see renderMyShowsView) covered the
  // same need without the one-group limitation. Add Show is always
  // visible here now too — it used to hide on the My Shows tab.
  async function renderCurrentView(groupId) {
    const { shows, responsesByShow } = await loadGroupData(groupId);
    addShowCard.style.display = 'block';
    renderListView(shows, responsesByShow, 'No shows yet.');
  }

  // One labeled avatar group — reused for both "Heck yeah!" (curious)
  // and "Can't make it" (out), same shape either way: a small header
  // label, everyone in that group except me, and a fixed slot for my
  // own status that's either a ghost "+" (tap to join this list) or my
  // filled dot (if I'm already in it). Symmetric by design: whichever
  // list I haven't joined shows its ghost, so I can always switch.
  // Clicking anywhere else on the group (label, avatars, my own dot)
  // opens a modal with everyone in it, name + avatar — the ghost "+"
  // stops that click from bubbling up, since tapping it is a different
  // action (joining), not "show me who's here."
  function buildResponseGroup(label, peopleExceptMe, amIIn, joinAriaLabel, onJoin, allPeople) {
    const group = document.createElement('div');
    group.className = 'avatar-group';

    const labelEl = document.createElement('div');
    labelEl.className = 'avatar-group-label';
    labelEl.textContent = label;
    group.appendChild(labelEl);

    const row = document.createElement('div');
    row.className = 'avatar-group-row';

    if (peopleExceptMe.length > 0) {
      row.appendChild(buildAvatarDots(peopleExceptMe));
    }

    const mySlot = document.createElement('div');
    mySlot.className = 'avatar-my-slot';

    if (amIIn) {
      const myDot = document.createElement('div');
      myDot.className = 'avatar-dot';
      const myColor = avatarColor(person);
      myDot.style.background = myColor;
      myDot.style.color = contrastTextFor(myColor);
      myDot.textContent = initials(person.display_name);
      mySlot.appendChild(myDot);
    } else {
      const ghostAdd = document.createElement('button');
      ghostAdd.type = 'button';
      ghostAdd.className = 'avatar-ghost-add';
      ghostAdd.textContent = '+';
      ghostAdd.setAttribute('aria-label', joinAriaLabel);
      ghostAdd.addEventListener('click', (e) => {
        e.stopPropagation();
        onJoin();
      });
      mySlot.appendChild(ghostAdd);
    }
    row.appendChild(mySlot);

    group.appendChild(row);

    if (allPeople.length > 0) {
      group.classList.add('avatar-group-clickable');
      group.addEventListener('click', () => openPeopleModal(label, allPeople));
    }

    return group;
  }

  // No drill-down page yet — the detail-arrow/onViewDetails hook that
  // used to sit on the headline (and the separate detail page it
  // opened) was cut. Everything worth seeing lives right on the card;
  // revisit a real detail page if that stops being true.
  // onDeclineOverride — only set by the cross-group My Shows view (see
  // renderListView/handleDeclineWithUndo below). Marking "out" there
  // removes the show from the very list it's sitting in (My Shows only
  // ever shows curious picks), which used to just vanish the card
  // instantly — jarring, and no way back if it was a misclick. The
  // override swaps that for a fade + Undo instead of the normal
  // "save and refresh" path. A group's own page doesn't need this —
  // marking out there just dims the card in place (.is-out), it never
  // disappears, so the default path still applies.
  function renderShowInteractiveBody(container, show, responses, onResponseChange, onDeclineOverride) {
    const mine = responses.find((r) => r.person_id === person.id);
    const interested = responses.filter((r) => r.status === 'curious');

    container.innerHTML = '';

    const titleRow = document.createElement('div');
    titleRow.className = 'show-title-row';
    const titleEl = document.createElement('div');
    titleEl.className = 'show-title';
    titleEl.innerHTML = show.source_url
      ? `<a href="${show.source_url}" target="_blank" rel="noopener">${show.title}</a>`
      : show.title;
    titleRow.appendChild(titleEl);

    // Ticket-intent signal — the show title *is* the buy-tickets link
    // (no separate "Buy Tickets" button exists in this UI), so that's
    // where buy_tickets_clicked lives. Doesn't block the navigation,
    // just observes it.
    if (show.source_url) {
      const ticketLink = titleEl.querySelector('a');
      if (ticketLink) {
        ticketLink.addEventListener('click', () => {
          trackEvent('buy_tickets_clicked', { group_id: show.group_id, show_id: show.id });
        });
      }
    }
    container.appendChild(titleRow);

    if (show.venue_name) {
      const venue = document.createElement('div');
      venue.className = 'show-venue';
      venue.innerHTML = show.venue_url
        ? `<a href="${show.venue_url}" target="_blank" rel="noopener">${show.venue_name}</a>`
        : show.venue_name;
      container.appendChild(venue);
    }

    if (show.openers) {
      const openers = document.createElement('div');
      openers.className = 'show-openers';
      openers.textContent = `with ${show.openers}`;
      container.appendChild(openers);
    }

    // Two labeled groups, side by side: who's curious ("Heck yeah!")
    // and who can't make it ("Can't make it") — each with its own
    // ghost "+" slot, so joining either list is the same gesture in
    // the same shape, not a stack of avatars plus a separate text
    // button. Replaces the old single row + "Can't make it" button.
    const avatarRow = document.createElement('div');
    avatarRow.className = 'show-card-avatars';

    const curiousExceptMe = interested.filter((r) => r.person_id !== person.id).map((r) => r.people);
    const declined = responses.filter((r) => r.status === 'out');
    const declinedExceptMe = declined.filter((r) => r.person_id !== person.id).map((r) => r.people);

    avatarRow.appendChild(buildResponseGroup(
      'Heck yeah!',
      curiousExceptMe,
      !!(mine && mine.status === 'curious'),
      "I'm curious",
      async () => {
        const ok = await setResponse(show.id, person.id, 'curious');
        if (ok) {
          // interested.length is the curious count *before* this tap,
          // and excludes the actor (they weren't in it — the ghost "+"
          // slot only shows when they aren't curious yet). So the new
          // total is interested.length + 1; overlap_reached fires only
          // on the exact 1→2 transition, never again for this show, so
          // it's a true one-time-per-show north-star signal, not a
          // running counter.
          trackEvent('curious_tapped', { group_id: show.group_id, show_id: show.id });
          if (interested.length === 1) {
            trackEvent('overlap_reached', { group_id: show.group_id, show_id: show.id, overlap_count: 2 });
          }
          await onResponseChange();
        }
      },
      interested.map((r) => r.people)
    ));

    const cantMakeItGroup = buildResponseGroup(
      "Can't make it",
      declinedExceptMe,
      !!(mine && mine.status === 'out'),
      "Can't make it",
      onDeclineOverride || (async () => {
        const ok = await setResponse(show.id, person.id, 'out');
        if (ok) {
          trackEvent('out_tapped', { group_id: show.group_id, show_id: show.id });
          await onResponseChange();
        }
      }),
      declined.map((r) => r.people)
    );
    cantMakeItGroup.classList.add('avatar-group-declined');
    avatarRow.appendChild(cantMakeItGroup);

    container.appendChild(avatarRow);

    // Handed back so handleDeclineWithUndo can find this group's own
    // .avatar-my-slot after a re-render and drop the inline Undo
    // button right next to the now-moved avatar, instead of building
    // a separate undo bar elsewhere in the card.
    return cantMakeItGroup;
  }

  // Plain text, no pill — see .show-date-badge in components.css.
  function buildDateBadge(show) {
    const badge = document.createElement('div');
    badge.className = 'show-date-badge';
    badge.textContent = formatDate(show.show_date, show.show_time);
    return badge;
  }

  // Remove a show entirely — only ever rendered for the person who
  // added it (see the created_by check above). Confirms via a plain
  // window.confirm() before deleting, same "reach for the browser's
  // own primitive" approach the Leave herd button already uses — this
  // app has no destructive-red token anywhere, so a ghost icon button
  // plus a native confirm is the whole affordance, no custom modal.
  function buildDeleteButton(show, refresh) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'show-delete-btn';
    btn.setAttribute('aria-label', 'Remove show');
    btn.innerHTML = '<i data-lucide="trash-2"></i>';
    lucide.createIcons({ root: btn });

    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!window.confirm(`Remove "${show.title}"? This can't be undone.`)) return;

      btn.disabled = true;
      const ok = await OTR.deleteShow(show.id);
      if (!ok) {
        btn.disabled = false;
        return;
      }
      trackEvent('show_deleted', { group_id: show.group_id, show_id: show.id });
      refresh();
    });

    return btn;
  }

  // Empty stage, waiting for a show — a flat, single-color guitar
  // silhouette (headstock, neck, figure-8 body from two overlapping
  // filled circles, soundhole punched through with the page's own
  // background color), used for every "nothing here yet" moment: no
  // shows, no shows in this tab, no group yet. Flat fill, no
  // gradient/shadow, per the brand's flat-full-stop rule.
  const EMPTY_STATE_ICON = '<svg viewBox="0 0 64 64"><rect x="27" y="2" width="10" height="9" rx="2" fill="currentColor"/><rect x="30" y="10" width="4" height="24" fill="currentColor"/><circle cx="32" cy="37" r="9" fill="currentColor"/><circle cx="32" cy="50" r="12" fill="currentColor"/><circle cx="32" cy="43" r="3.5" fill="var(--color-bg)"/></svg>';

  function renderEmptyState(container, message) {
    container.className = 'show-list-empty';
    // Icon + message sit inside a big darker circle now, per direct
    // feedback — the circle is its own element (not just a background
    // on .show-list-empty) so it can stay solid/undimmed while the
    // icon and message keep their own quieter, dimmed treatment on
    // top of it (see .show-list-empty-circle in components.css).
    container.innerHTML = `<div class="show-list-empty-circle"><div class="show-list-empty-icon">${EMPTY_STATE_ICON}</div><div class="show-list-empty-message">${message}</div></div>`;
  }

  // Marking a show "out" from the cross-group My Shows view removes it
  // from the very list it's sitting in (My Shows only ever shows
  // curious picks) — used to just vanish the card the instant you
  // clicked, with no way back if it was a misclick. Per direct
  // feedback, the avatar itself needs to actually move to the "Can't
  // make it" slot right away (real confirmation, not a frozen avatar
  // behind a fade), and the old separate "Marked can't make it." bar
  // is gone — the Undo lives right next to the moved avatar instead.
  // The card still dims slowly in the background as a "pending
  // removal" signal, and if Undo isn't clicked within the window, the
  // pending refresh runs and the card leaves for real.
  const UNDO_WINDOW_MS = 4000;
  function handleDeclineWithUndo(show, card, body, responses, refresh) {
    return async () => {
      const ok = await setResponse(show.id, person.id, 'out');
      if (!ok) return;
      trackEvent('out_tapped', { group_id: show.group_id, show_id: show.id, via: 'my_shows' });

      // Reflect the new status locally so the avatar re-renders into
      // the "Can't make it" slot immediately, instead of waiting on a
      // full refetch — same instant-reflect approach every other
      // response change in the app already uses.
      const updatedResponses = responses.filter((r) => r.person_id !== person.id);
      updatedResponses.push({ person_id: person.id, status: 'out', people: person });

      const declinedGroup = renderShowInteractiveBody(body, show, updatedResponses, refresh);
      card.classList.add('show-card-content-fading');

      const mySlot = declinedGroup && declinedGroup.querySelector('.avatar-my-slot');
      if (!mySlot) return;

      const undoBtn = document.createElement('button');
      undoBtn.type = 'button';
      undoBtn.className = 'link-btn show-undo-btn';
      undoBtn.textContent = 'Undo';
      mySlot.appendChild(undoBtn);

      const timer = setTimeout(() => { refresh(); }, UNDO_WINDOW_MS);

      // Stops the click from bubbling to the group's own click handler
      // (opens the "who's in" modal) — same reasoning as the ghost-add
      // button's own stopPropagation.
      undoBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        clearTimeout(timer);
        const restored = await setResponse(show.id, person.id, 'curious');
        if (!restored) return;
        // Deliberately no trackEvent here — this is undoing an
        // accidental decline, not a fresh curious signal, so it
        // shouldn't count toward curious_tapped/overlap_reached (see
        // analytics plan's "undo-guard" note).
        card.classList.remove('show-card-content-fading');
        const restoredResponses = updatedResponses.filter((r) => r.person_id !== person.id);
        restoredResponses.push({ person_id: person.id, status: 'curious', people: person });
        renderShowInteractiveBody(body, show, restoredResponses, refresh);
      });
    };
  }

  // onChange defaults to the single-group refresh every existing
  // caller wants; the cross-group My Shows view (see renderMyShowsView
  // below) passes its own so a response change re-runs the aggregate
  // fetch instead of trying to refresh one group that isn't selected.
  // declineWithUndo, also My-Shows-only, swaps the decline button's
  // default "save and refresh" for handleDeclineWithUndo above.
  function renderListView(shows, responsesByShow, emptyMessage, onChange, declineWithUndo) {
    const content = listContent;
    const refresh = onChange || (() => renderCurrentView(currentGroupId));

    if (shows.length === 0) {
      renderEmptyState(content, emptyMessage || 'No shows yet.');
      return;
    }

    content.className = '';
    content.innerHTML = '';

    shows.forEach((show) => {
      const responses = responsesByShow[show.id] || [];
      const mine = responses.find((r) => r.person_id === person.id);

      const card = document.createElement('div');
      card.className = 'show-card';
      if (mine && mine.status === 'out') card.classList.add('is-out');

      card.appendChild(buildDateBadge(show));

      // Only the person who added a show can remove it — same
      // "creator owns it" rule the delete already enforces server-side
      // in OTR.deleteShow. Top-right corner, same spot .modal-close-btn
      // uses for its own dismiss action elsewhere in the app, rather
      // than crowding the avatar row at the bottom of the card.
      if (show.created_by === person.id) {
        card.appendChild(buildDeleteButton(show, refresh));
      }

      // Only set in the cross-group My Shows view (see
      // renderMyShowsView) — a quiet reminder of which group this show
      // actually belongs to, since there's no single group heading
      // doing that job here the way there is on Herd Picks.
      if (show._groupName) {
        const tag = document.createElement('div');
        tag.className = 'show-group-tag';
        tag.textContent = show._groupName;
        card.appendChild(tag);
      }

      // The "N overlap" badge (.show-overlap/.show-card-top) that used
      // to sit here — cut per direct feedback. Who's actually curious
      // still shows up in the "Heck yeah!" avatar row below; this was
      // a second, redundant count of the same thing sitting above it.
      // overlapCount() itself stays in scripts/shows.js — small, still
      // documented, not wired to any UI right now.

      const body = document.createElement('div');
      card.appendChild(body);
      const onDecline = declineWithUndo ? handleDeclineWithUndo(show, card, body, responses, refresh) : undefined;
      renderShowInteractiveBody(body, show, responses, refresh, onDecline);

      content.appendChild(card);
    });
  }

  // Cross-group "My Shows" — every show, in every group this person
  // is a member of, that they've personally marked curious. Fetches
  // per-group (loadGroupData already exists for the single-group
  // case) in parallel, then flattens into one sorted list rather than
  // adding a dedicated cross-group query — myGroups is already loaded
  // client-side, and this only runs when someone actually opens the
  // view, not on every render.
  async function renderMyShowsView() {
    trackEvent('my_shows_viewed', {});
    currentGroupId = null;
    currentGroup = null;
    drawerMyShowsBtn.classList.add('active');
    await renderGroupSwitcher(myGroups);
    closeDrawer();

    groupHeadingRow.style.display = 'none';
    addShowCard.style.display = 'none';
    myShowsHeadingRow.style.display = 'flex';

    const perGroup = await Promise.all(
      myGroups.map(async (g) => ({ group: g, ...(await loadGroupData(g.id)) }))
    );

    const mergedResponses = {};
    const myShows = [];
    perGroup.forEach(({ group, shows, responsesByShow }) => {
      Object.assign(mergedResponses, responsesByShow);
      shows.forEach((s) => {
        const mine = (responsesByShow[s.id] || []).find(
          (r) => r.person_id === person.id && r.status === 'curious'
        );
        if (mine) myShows.push(Object.assign({ _groupName: group.name }, s));
      });
    });
    myShows.sort((a, b) => (a.show_date || '').localeCompare(b.show_date || ''));

    renderListView(
      myShows,
      mergedResponses,
      'No shows marked yet.',
      () => renderMyShowsView(),
      true
    );
  }

  drawerMyShowsBtn.addEventListener('click', renderMyShowsView);

  // Opens the New herd modal (see openNewGroupModal above) — actual
  // group creation now happens in that modal's own form submit
  // handler, not here. Kept as a named function (rather than wiring
  // openNewGroupModal directly to the button) so the click listener
  // below reads the same way every other drawerNewGroupBtn-adjacent
  // handler in this file does.
  function handleNewGroup() {
    openNewGroupModal();
  }

  // Processes ?g=<slug> from a shared invite link: looks up the group
  // and adds the person to it. Safe to no-op (bad slug, no param, or
  // already a member) — the URL param is cleaned up either way so a
  // page refresh doesn't keep re-processing it.
  async function handleGroupJoinFromUrl(personId) {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('g');
    if (!slug) return null;

    // Cleans up to "/" specifically, not window.location.pathname --
    // same reasoning as copyInviteLink() above, so an invite visitor
    // lands on the clean canonical URL after the ?g= param is
    // stripped, regardless of whether the link they clicked pointed
    // at "/" or "/index.html".
    window.history.replaceState({}, '', '/');

    const group = await getGroupBySlug(slug);
    if (!group) return null;

    await joinGroup(personId, group.id);
    // Note: joinGroup upserts with ignoreDuplicates, so this fires on
    // every visit via an invite link, not just the first — Supabase
    // doesn't tell us whether the upsert actually inserted a new row.
    // Slightly overcounts if the same person reopens an old invite
    // link, but undercounting a first join would be worse; revisit if
    // invite_accepted volume looks inflated relative to invite_sent.
    trackEvent('invite_accepted', { group_id: group.id });
    return group;
  }

  // Colors both places "you" show up as a filled dot (drawer avatar,
  // header trigger) with your chosen color, and (re)builds the swatch
  // picker with the current choice ringed. Called on load and again
  // any time the color changes, since a change also has to ripple out
  // to every show card's avatar row (handled by the caller re-running
  // renderCurrentView after this).
  function renderMyAvatarChrome() {
    const color = avatarColor(person);
    const textColor = contrastTextFor(color);
    drawerAvatar.style.setProperty('--avatar-color', color);
    drawerAvatar.style.color = textColor;
    drawerAvatar.textContent = initials(person.display_name);
    hamburgerBtn.style.setProperty('--avatar-color', color);
    hamburgerBtn.style.color = textColor;
    headerAvatarInitials.textContent = initials(person.display_name);
    // Feeds .drawer-identity-section's dual-tone glow (see
    // components.css) — same custom property already applied to the
    // drawer avatar and header trigger, just also set on the identity
    // section itself now so its background gradient tracks whichever
    // color is currently chosen.
    drawerIdentitySection.style.setProperty('--avatar-color', color);

    avatarColorPicker.innerHTML = '';
    AVATAR_COLORS.forEach((c) => {
      const swatch = document.createElement('button');
      swatch.type = 'button';
      swatch.className = 'avatar-color-swatch' + (color === c.hex ? ' active' : '');
      swatch.style.background = c.hex;
      swatch.setAttribute('aria-label', c.name);
      swatch.addEventListener('click', async () => {
        if (avatarColor(person) === c.hex) return;
        const ok = await updatePersonColor(person.id, c.hex);
        if (!ok) return;
        person.avatar_color = c.hex;
        renderMyAvatarChrome();
        if (currentGroupId) await renderCurrentView(currentGroupId);
      });
      avatarColorPicker.appendChild(swatch);
    });
  }

  // Click the avatar, or the name + pencil icon beside it, to open/
  // close the name + color edit panel below — collapsed by default
  // now (see the drawer-identity-edit HTML comment for why), so
  // opening it always starts from the current name rather than
  // whatever was left typed in from last time. Two separate triggers
  // (can't nest a button in a button) toggle the same shared state.
  function setIdentityEditOpen(open) {
    drawerIdentityEdit.style.display = open ? 'block' : 'none';
    drawerAvatar.setAttribute('aria-expanded', open ? 'true' : 'false');
    drawerNameBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) drawerNameInput.value = person.display_name;
  }

  function toggleIdentityEdit() {
    const isOpen = drawerIdentityEdit.style.display !== 'none';
    setIdentityEditOpen(!isOpen);
    if (!isOpen) drawerNameInput.focus();
  }

  drawerAvatar.addEventListener('click', toggleIdentityEdit);
  drawerNameBtn.addEventListener('click', toggleIdentityEdit);

  // Saves on blur, not on every keystroke — Enter just blurs (no
  // actual form here, so no submit event to hook), same "commit on
  // leave" pattern as any plain text field without its own button.
  async function saveNameIfChanged() {
    const newName = drawerNameInput.value.trim();
    if (!newName || newName === person.display_name) {
      drawerNameInput.value = person.display_name;
      return;
    }
    const ok = await updatePersonName(person.id, newName);
    if (!ok) return;
    person.display_name = newName;
    drawerName.textContent = newName;
    renderMyAvatarChrome();
    if (currentGroupId) await renderCurrentView(currentGroupId);
  }

  drawerNameInput.addEventListener('blur', saveNameIfChanged);
  drawerNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      drawerNameInput.blur();
    }
  });

  async function afterPerson() {
    // person_id as a GA4 user property (not group_id — a person moves
    // between groups over time, so group_id travels as a per-event
    // param instead; see analytics plan). Cookie identity is already
    // the source of truth here, this just lets us segment by it in GA.
    if (typeof gtag === 'function') {
      gtag('set', 'user_properties', { person_id: person.id });
    }

    drawerName.textContent = person.display_name;
    renderMyAvatarChrome();

    const joinedGroup = await handleGroupJoinFromUrl(person.id);
    myGroups = await getMyGroups(person.id);

    if (myGroups.length === 0) {
      groupBar.style.display = 'none';
      groupHeadingRow.style.display = 'none';
      renderEmptyState(document.getElementById('show-list-content'), 'No groups yet.');
      return;
    }

    const targetGroup = myGroups.find((g) => g.id === joinedGroup?.id) || myGroups[0];
    await selectGroup(targetGroup);
  }

  async function init() {
    person = await getPerson();

    if (!person) {
      siteHeader.style.display = 'none';
      mainContent.style.display = 'none';
      nameGate.style.display = 'block';
      nameGateGroupRow.style.display = hasInviteSlug ? 'none' : 'block';

      // Invite-link visitor: name the actual group they're about to
      // join, as a second line under the brand tagline (not a
      // replacement for it) — so the raw ?g=<slug> in the URL bar
      // isn't the only context they get. Looked up separately from
      // (and before) handleGroupJoinFromUrl's own getGroupBySlug call,
      // which only runs after they've entered a name — this is purely
      // for the copy, doesn't join anything. Stays hidden on a stale/
      // bad slug rather than claiming an invite that doesn't check out.
      if (hasInviteSlug) {
        const invitedGroup = await getGroupBySlug(inviteSlug);
        if (invitedGroup) {
          nameGateInviteMessage.textContent = `You've been invited to join "${invitedGroup.name}" to track shows together. Add your name and jump in.`;
          nameGateInviteMessage.style.display = 'block';
        }
      }
      return;
    }

    await afterPerson();
  }

  // Reveals the normal app shell and runs the usual post-person setup
  // (join-by-slug if applicable, load groups, select one).
  async function enterAppFromGate() {
    nameGate.style.display = 'none';
    siteHeader.style.display = '';
    mainContent.style.display = '';
    // Whatever scroll position the page was at while the name gate was
    // showing (e.g. the on-screen keyboard nudging things around while
    // typing a group name) doesn't reset itself just because the DOM
    // underneath it changed — the browser keeps the same scrollY, which
    // can leave the header out of view the instant the real app
    // appears. Explicit reset, not a guess: per direct feedback, the
    // header should never load out of view on first entry.
    window.scrollTo(0, 0);
    await afterPerson();
  }

  nameGateForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name-gate-input').value.trim();
    if (!name) return;

    person = await createPerson(name, randomAvatarColor());
    if (!person) return;

    if (hasInviteSlug) {
      // Joining a group that already exists — nothing left to set up.
      await enterAppFromGate();
      return;
    }

    // Cold start: the group-name field was right there in the same
    // form, so create it now instead of a separate step. Used to drop
    // into a "you're in, share the link" interstitial screen here —
