    // cut per direct feedback (felt like an unnecessary extra beat);
    // straight into the app now, same as the invite-link path. The
    // group heading row's share icon and the drawer's per-group share
    // icon both still cover "grab the invite link," just not as a
    // forced first stop.
    const groupName = document.getElementById('name-gate-group-input').value.trim();
    if (groupName) {
      const group = await createGroup(person.id, groupName);
      if (group) trackEvent('group_created', { group_id: group.id, via: 'cold_start' });
    }
    await enterAppFromGate();
  });

  // Swaps every static <i data-lucide="..."> placeholder already in
  // the initial HTML (drawer close, modal close, group heading share)
  // for its real inline SVG. Dynamically-rendered icons (the per-group
  // share buttons in the drawer) get their own scoped call inside
  // renderGroupSwitcher(), since createIcons() only sees elements
  // that exist in the DOM at the moment it runs.
  lucide.createIcons();

  init();

  // Nav drawer open/close — hamburger, close button, overlay click,
  // and Escape all close it; body scroll locks while it's open so
  // background content doesn't scroll behind it.
  function openDrawer() {
    navDrawer.classList.add('open');
    drawerOverlay.classList.add('open');
    navDrawer.setAttribute('aria-hidden', 'false');
    hamburgerBtn.setAttribute('aria-expanded', 'true');
    document.body.classList.add('drawer-open');
  }
  function closeDrawer() {
    navDrawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
    navDrawer.setAttribute('aria-hidden', 'true');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('drawer-open');
    setIdentityEditOpen(false);
  }
  hamburgerBtn.addEventListener('click', openDrawer);
  drawerCloseBtn.addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });

  // ===== Add show: two entry methods (search, manual), funneling into
  // the same manual form for review before submit. "Paste a link" was
  // cut — one fewer entry point, search covers the common case. =====

  function resetAddShowPanel() {
    addShowForm.reset();
    addShowForm.style.display = 'none';

    artistSearchInput.value = '';
    artistSearchStatus.textContent = '';
    artistSearchResults.innerHTML = '';
    artistSearchResults.style.display = 'none';

    venueSearchResults.innerHTML = '';
    venueSearchResults.style.display = 'none';
    selectedVenueUrl = null;
    selectedSourceUrl = null;

    document.getElementById('search-method-row').style.display = 'block';

    closeAddShowModal();
  }

  function revealManualForm(prefill) {
    document.getElementById('show-title').value = prefill?.title || '';
    document.getElementById('show-date-input').value = prefill?.show_date || '';
    venueNameInput.value = prefill?.venue_name || '';
    selectedVenueUrl = prefill?.venue_url || null;
    selectedSourceUrl = prefill?.source_url || null;
    addShowForm.style.display = 'block';
    addShowForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Used when search already has enough to create the show outright
  // (title + date) — no review form, just add it. Falls back to the
  // form if the data turns out to be incomplete.
  async function submitShowDirectly(fields, source) {
    if (!currentGroupId) return;
    if (!fields.title || !fields.show_date) {
      revealManualForm(fields);
      return;
    }
    const show = await createShow(currentGroupId, person.id, fields);
    if (show) {
      trackEvent('show_added', { group_id: show.group_id, show_id: show.id, source: source || 'manual' });
      // Adding a show is itself a "curious" signal — without this the
      // person who just added it would see their own ghost add-slot
      // (the tinted + circle) on a card they created themselves,
      // which reads as if the app didn't notice they're in. Not
      // counted toward overlap_reached here since nobody else can
      // possibly be curious yet on a show that was just created —
      // the 1→2 transition logic in renderShowInteractiveBody only
      // applies there, not to this auto-join.
      await setResponse(show.id, person.id, 'curious');
      trackEvent('curious_tapped', { group_id: show.group_id, show_id: show.id, via: 'show_creation' });
      resetAddShowPanel();
      await renderCurrentView(currentGroupId);
    }
  }

  // Same button both opens and closes now — toggle based on whether
  // the card's already open.
  addShowBtn.addEventListener('click', () => {
    if (addShowCard.classList.contains('is-open')) {
      resetAddShowPanel();
    } else {
      openAddShowModal();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && addShowCard.classList.contains('is-open')) resetAddShowPanel();
  });

  cancelAddShow.addEventListener('click', resetAddShowPanel);

  // Method switching
  showManualMethodBtn.addEventListener('click', () => {
    revealManualForm(null);
  });

  // Method 1: artist search (Ticketmaster, New England)
  artistSearchBtn.addEventListener('click', async () => {
    const keyword = artistSearchInput.value.trim();
    if (!keyword) return;

    artistSearchStatus.textContent = 'Searching…';
    artistSearchResults.style.display = 'none';
    artistSearchResults.innerHTML = '';

    const results = await searchShows(keyword);

    if (results.length === 0) {
      artistSearchStatus.textContent = 'No shows found — try adding manually.';
      return;
    }

    artistSearchStatus.textContent = `${results.length} show${results.length === 1 ? '' : 's'} found`;
    artistSearchResults.style.display = 'block';

    results.forEach((show) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'search-result-item';
      item.innerHTML = `
        <div class="result-title">${show.title || 'Untitled show'}</div>
        <div class="result-meta">${show.show_date || 'No date'}${show.venue_name ? ' · ' + show.venue_name : ''}</div>
      `;
      item.addEventListener('click', () => submitShowDirectly(show, 'ticketmaster'));
      artistSearchResults.appendChild(item);
    });
  });

  // Venue-name autocomplete — debounced lookup against Ticketmaster's
  // venue directory. Picking a suggestion silently attaches its venue
  // link; there's no visible link field for it to appear in.
  venueNameInput.addEventListener('input', () => {
    selectedVenueUrl = null;
    clearTimeout(venueSearchTimer);

    const keyword = venueNameInput.value.trim();
    if (keyword.length < 3) {
      venueSearchResults.style.display = 'none';
      venueSearchResults.innerHTML = '';
      return;
    }

    venueSearchTimer = setTimeout(async () => {
      const venues = await searchVenues(keyword);
      venueSearchResults.innerHTML = '';

      if (venues.length === 0) {
        venueSearchResults.style.display = 'none';
        return;
      }

      venues.forEach((v) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'search-result-item';
        item.innerHTML = `
          <div class="result-title">${v.name}</div>
          ${v.city ? `<div class="result-meta">${v.city}</div>` : ''}
        `;
        item.addEventListener('click', () => {
          venueNameInput.value = v.name;
          selectedVenueUrl = v.url;
          venueSearchResults.style.display = 'none';
          venueSearchResults.innerHTML = '';
        });
        venueSearchResults.appendChild(item);
      });

      venueSearchResults.style.display = 'block';
    }, 300);
  });

  // Method 2: manual submit — used for plain manual entry, and as the
  // fallback when search didn't have enough to add the show outright.
  addShowForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fields = {
      title: document.getElementById('show-title').value.trim(),
      show_date: document.getElementById('show-date-input').value,
      venue_name: venueNameInput.value.trim(),
      venue_url: selectedVenueUrl,
      source_url: selectedSourceUrl,
    };
    await submitShowDirectly(fields, 'manual');
  });
</script>

</body>
</html>
