  const hamburgerBtn = document.getElementById('hamburger-btn');
  const headerAvatarInitials = document.getElementById('header-avatar-initials');
  const avatarColorPicker = document.getElementById('avatar-color-picker');
  const drawerOverlay = document.getElementById('drawer-overlay');
  const navDrawer = document.getElementById('nav-drawer');
  const drawerIdentitySection = document.getElementById('drawer-identity-section');
  const drawerCloseBtn = document.getElementById('drawer-close-btn');
  const drawerAvatar = document.getElementById('drawer-avatar');
  const drawerName = document.getElementById('drawer-name');
  const drawerNameBtn = document.getElementById('drawer-name-btn');
  const drawerIdentityEdit = document.getElementById('drawer-identity-edit');
  const drawerNameInput = document.getElementById('drawer-name-input');

  // Group list — lives inside the drawer now (was a header dropdown).
  const groupBar = document.getElementById('group-bar');
  const drawerGroupList = document.getElementById('drawer-group-list');
  const drawerNewGroupBtn = document.getElementById('drawer-new-group-btn');
  const drawerMyShowsBtn = document.getElementById('drawer-my-shows-btn');

  const addShowCard = document.getElementById('add-show-card');
  const addShowBtn = document.getElementById('add-show-btn');
  const addShowPanel = document.getElementById('add-show-panel');
  const addShowForm = document.getElementById('add-show-form');
  const cancelAddShow = document.getElementById('cancel-add-show');

  // One card the whole time — `.is-open` on the outer card is what
  // drives both the icon's 45° rotation and the panel's grow/shrink
  // (a CSS grid-rows trick, 0fr closed → 1fr open — see .add-show-panel
  // in components.css), so opening/closing reads as this one card
  // animating, not a second box appearing underneath it.
  function openAddShowModal() {
    addShowCard.classList.add('is-open');
    addShowCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function closeAddShowModal() {
    addShowCard.classList.remove('is-open');
  }

  const artistSearchInput = document.getElementById('artist-search-input');
  const artistSearchBtn = document.getElementById('artist-search-btn');
  const artistSearchStatus = document.getElementById('artist-search-status');
  const artistSearchResults = document.getElementById('artist-search-results');

  const showManualMethodBtn = document.getElementById('show-manual-method-btn');

  const venueNameInput = document.getElementById('show-venue-name');
  const venueSearchResults = document.getElementById('venue-search-results');

  let currentGroupId = null;
  let currentGroup = null;
  let myGroups = [];
  let selectedVenueUrl = null;
  let selectedSourceUrl = null;
  let venueSearchTimer = null;

  function initials(name) {
    return name.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  // Shared invite-link logic — was duplicated inline on the name-gate's
  // "Copy invite link" button; now the one place any share control
  // (the group heading row, each drawer group row, the group modal)
  // builds the link and writes it to the clipboard. Placeholder
  // ?g=<slug> link structure — real domain/slug work comes later once
  // a real URL domain is set up; this just reuses what already
  // existed. Returns whether the clipboard write succeeded, so
  // callers can show their own success feedback (a text swap on the
  // group modal's invite button, a brief icon swap on icon-only
  // buttons) without duplicating the try/catch here.
  //
  // Copies a full sentence, not just the bare URL — a raw link pasted
  // into a text thread carries no context on its own about what it
  // even is. `groupName` is required (every current call site already
  // has the group object in hand) so the message can name the actual
  // group, not just the app in the abstract. Voice matches the app's
  // own tagline everywhere else — direct, no exclamation points, no
  // manufactured urgency (see brand-brief.md's Voice section).
  async function copyInviteLink(slug, groupName, groupId) {
    // "/" not window.location.pathname -- pathname reflects whatever
    // URL the sharer happens to be on (e.g. "/index.html" after
    // clicking the wordmark, or a stale cached hit), which produced
    // inconsistent, ugly invite links depending on where someone was
    // standing when they hit share. The invite always points at the
    // same single-page app either way, so it should always look the
    // same too -- hardcoded to the clean root path.
    const link = `${window.location.origin}/?g=${slug}`;
    const message = `Join ${groupName} on GigHerd — line up shows with your pals: ${link}`;
    trackEvent('invite_sent', { group_id: groupId || null });
    try {
      await navigator.clipboard.writeText(message);
      return true;
    } catch {
      window.prompt('Copy this invite message:', message);
      return false;
    }
  }

  // Brief checkmark swap for icon-only share buttons (no text label to
  // swap to "Copied!" the way the name-gate button does). Re-runs
  // lucide.createIcons() scoped to the button itself so only its one
  // icon gets replaced, not the whole page.
  function flashShareSuccess(btn) {
    btn.innerHTML = '<i data-lucide="check"></i>';
    lucide.createIcons({ root: btn });
    setTimeout(() => {
      btn.innerHTML = '<i data-lucide="share"></i>';
      lucide.createIcons({ root: btn });
    }, 1500);
  }

  // Fixed palette for avatar dots — not a free color picker. Pink is
  // deliberately excluded; it stays reserved for overlap/logo/hover
  // (see tokens.css). First entry, "Paper," used to be the automatic
  // default for everyone — meaning every new person showed up looking
  // identical until they thought to go pick a color themselves, which
  // in practice most people never did. New signups now get a random
  // color from the other seven right away (see randomAvatarColor,
  // called from the name-gate submit handler) — everyone's actually
  // distinguishable from the first show card they see, and "Your
  // color" in the drawer becomes a real edit, not a first-run chore.
  // Paper stays in the palette as a manual pick, just not the default.
  //
  // The other seven are tuned to the logo's own tone/value — same
  // saturation (~54%) and lightness (~51%) as --color-logo-green —
  // just spread across different hues, so every avatar color reads as
  // a sibling of the logo instead of an unrelated grab-bag (the old
  // set mixed muted teal/slate/wine/mustard tones that didn't share
  // any register with the wordmark). Green's own hue and the whole
  // pink range are skipped so no swatch gets mistaken for the logo or
  // the overlap marker.
  const AVATAR_COLORS = [
    { hex: '#ebe8e1', name: 'Paper' }, // ds:intentional — deliberately reuses --color-text's value as the palette's neutral default
    { hex: '#c66c3f', name: 'Rust' },
    { hex: '#c6a43f', name: 'Amber' },
    { hex: '#c53fb4', name: 'Berry' },
    { hex: '#3fc6a4', name: 'Jade' },
    { hex: '#3fa4c6', name: 'Sky' },
    { hex: '#3f56c6', name: 'Indigo' },
    { hex: '#773fc6', name: 'Violet' },
  ];

  function avatarColor(p) {
    return (p && p.avatar_color) || AVATAR_COLORS[0].hex;
  }

  // Random pick from everything but Paper (index 0) — used once, at
  // signup, so a fresh person doesn't start out looking like everyone
  // else's unedited default.
  function randomAvatarColor() {
    const pool = AVATAR_COLORS.slice(1);
    return pool[Math.floor(Math.random() * pool.length)].hex;
  }

  // Picking a single fixed text color for every avatar dot doesn't
  // work once "Paper" (near-white) is in the palette alongside dark
  // swatches like Wine or Graphite — white-on-white and charcoal-on-
  // charcoal are both real failure cases. This computes perceived
  // luminance per swatch and returns whichever of charcoal/white
  // actually reads on top of it.
  function contrastTextFor(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? '#211f1a' : '#ffffff'; // ds:intentional — mirrors --color-bg / --color-text-inverse; JS can't read CSS custom properties without extra plumbing
  }

  // Plain row of avatar dots, each filled with that person's own
  // chosen color (see AVATAR_COLORS) instead of a uniform charcoal, so
  // who's who is legible at a glance. No click-to-expand here anymore
  // — that's now a shared modal opened at the group level (see
  // buildResponseGroup/openPeopleModal below), not a per-stack dropdown.
  function buildAvatarDots(people) {
    const dots = document.createElement('div');
    dots.className = 'avatar-dots';
    people.forEach((p) => {
      const dot = document.createElement('div');
      dot.className = 'avatar-dot';
      const color = avatarColor(p);
      dot.style.background = color;
      dot.style.color = contrastTextFor(color);
      dot.textContent = initials(p.display_name);
      dots.appendChild(dot);
    });
    return dots;
  }

  // Shared avatar + name row builder — used by both the who's-in-this-
  // response-group modal (below) and the group modal's member list, so
  // the two don't drift into two slightly different "list of people"
  // implementations.
  function renderPersonList(container, people) {
    container.innerHTML = '';
    people.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'person-list-item';

      const dot = document.createElement('div');
      dot.className = 'avatar-dot';
      const color = avatarColor(p);
      dot.style.background = color;
      dot.style.color = contrastTextFor(color);
      dot.textContent = initials(p.display_name);
      item.appendChild(dot);

      const name = document.createElement('div');
      name.textContent = p.display_name;
      item.appendChild(name);

      container.appendChild(item);
    });
  }

  // Who's in a group — avatar + name rows in a modal, opened by
  // clicking either response group on a show card (see
  // buildResponseGroup). Same list for every group; only the title and
  // people differ per call.
  function openPeopleModal(title, people) {
    peopleModalTitle.textContent = title;
    renderPersonList(peopleModalList, people);
    peopleModalOverlay.style.display = 'flex';
  }

  function closePeopleModal() {
    peopleModalOverlay.style.display = 'none';
  }

  peopleModalCloseBtn.addEventListener('click', closePeopleModal);
  peopleModalOverlay.addEventListener('click', (e) => {
    if (e.target === peopleModalOverlay) closePeopleModal();
  });

  // Group modal — the current group's own management surface: invite,
  // full member list (not just who's responded to a show), leave.
  // Opened from the "view" icon in .group-heading-row.
  async function openGroupModal() {
    if (!currentGroup) return;
    groupModalTitle.textContent = currentGroup.name;
    setGroupNameEditOpen(false);
    const members = await getGroupMembers(currentGroup.id);
    renderPersonList(groupModalMemberList, members);
    groupModalOverlay.style.display = 'flex';
  }

  function closeGroupModal() {
    groupModalOverlay.style.display = 'none';
  }

  // Same toggle-to-edit shape as setIdentityEditOpen/toggleIdentityEdit
  // below — opening always starts from the current name rather than
  // whatever was left typed in from last time.
  function setGroupNameEditOpen(open) {
    groupModalNameEdit.style.display = open ? 'block' : 'none';
    groupModalTitleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) groupModalNameInput.value = currentGroup.name;
  }

  function toggleGroupNameEdit() {
    const isOpen = groupModalNameEdit.style.display !== 'none';
    setGroupNameEditOpen(!isOpen);
    if (!isOpen) groupModalNameInput.focus();
  }

  // Saves on blur, not on every keystroke — Enter just blurs, same
  // "commit on leave" pattern as the drawer's own name field.
  // Mutates currentGroup directly rather than refetching: currentGroup
  // is the same object reference sitting inside myGroups (selectGroup
  // is always called with an element from that array), so this also
  // keeps the drawer's group switcher in sync once it's re-rendered.
  async function saveGroupNameIfChanged() {
    const newName = groupModalNameInput.value.trim();
    if (!newName || newName === currentGroup.name) {
      groupModalNameInput.value = currentGroup.name;
      return;
    }
    const ok = await updateGroupName(currentGroup.id, newName);
    if (!ok) return;
    currentGroup.name = newName;
    groupModalTitle.textContent = newName;
    groupHeadingName.textContent = newName;
    await renderGroupSwitcher(myGroups);
  }

  groupModalTitleBtn.addEventListener('click', toggleGroupNameEdit);
  groupModalNameInput.addEventListener('blur', saveGroupNameIfChanged);
  groupModalNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      groupModalNameInput.blur();
    }
  });

  // "View" in the group heading row opens the group modal (member list
  // + leave — invite lives there too, redundant with the direct share
  // button below, but harmless to have in both places).
  groupViewBtn.addEventListener('click', openGroupModal);
  groupModalCloseBtn.addEventListener('click', closeGroupModal);
  groupModalOverlay.addEventListener('click', (e) => {
    if (e.target === groupModalOverlay) closeGroupModal();
  });

  // "Share" in the group heading row — a direct one-tap copy, no
  // modal in the way, same pattern as the drawer's per-group share
  // icons (icon flashes to a check on success instead of a text swap,
  // since there's no label here to swap).
  groupShareBtn.addEventListener('click', async () => {
    if (!currentGroup) return;
    const ok = await copyInviteLink(currentGroup.slug, currentGroup.name, currentGroup.id);
    if (ok) flashShareSuccess(groupShareBtn);
  });

  // Invite, from inside the group modal — same shared copyInviteLink()
  // helper every other share affordance uses. Has a real text label
  // (unlike the icon-only share buttons elsewhere), so success is a
  // text swap, same pattern as the name-gate's own "Copy invite link".
  groupModalInviteBtn.addEventListener('click', async () => {
    const ok = await copyInviteLink(currentGroup.slug, currentGroup.name, currentGroup.id);
    if (!ok) return;
    const label = groupModalInviteBtn.querySelector('span');
    const original = label.textContent;
    label.textContent = 'Copied!';
    setTimeout(() => { label.textContent = original; }, 1500);
  });

  // Leave group — confirms first (window.confirm(), same "reach for
  // the browser's own primitive" approach as the clipboard fallback
  // elsewhere), then removes the membership, drops the group from
  // myGroups, and either lands on the next remaining group or falls
  // back to the same zero-groups empty state afterPerson() shows a
  // brand-new person.
  groupModalLeaveBtn.addEventListener('click', async () => {
    if (!currentGroup) return;
    const confirmed = window.confirm(`Leave ${currentGroup.name}? You can rejoin later with an invite link.`);
    if (!confirmed) return;

    const left = await leaveGroup(person.id, currentGroup.id);
    if (!left) return;

    closeGroupModal();
    myGroups = myGroups.filter((g) => g.id !== currentGroup.id);
    currentGroup = null;
    currentGroupId = null;

    if (myGroups.length === 0) {
      // Leaving your last herd can't leave you herdless — see
      // ensureHerdExists().
      const solo = await ensureHerdExists();
      if (!solo) return;
      await selectGroup(solo);
      return;
    }

    await selectGroup(myGroups[0]);
  });

  // New herd modal — opened from the drawer's "+ Herd" button (see
  // handleNewGroup below), replacing what used to be a bare
  // window.prompt(). Same open/close/overlay-click/Escape conventions
  // as the group and people modals above.
  function openNewGroupModal() {
    newGroupInput.value = '';
    newGroupModalOverlay.style.display = 'flex';
    newGroupInput.focus();
  }

  function closeNewGroupModal() {
    newGroupModalOverlay.style.display = 'none';
  }

  newGroupModalCloseBtn.addEventListener('click', closeNewGroupModal);
  newGroupModalOverlay.addEventListener('click', (e) => {
    if (e.target === newGroupModalOverlay) closeNewGroupModal();
  });

  newGroupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = newGroupInput.value.trim();
    if (!name) return;
    closeNewGroupModal();
    const group = await createGroup(person.id, name);
    if (!group) return;
    trackEvent('group_created', { group_id: group.id });
    myGroups = await getMyGroups(person.id);
    await selectGroup(group);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (peopleModalOverlay.style.display === 'flex') closePeopleModal();
    if (groupModalOverlay.style.display === 'flex') closeGroupModal();
    if (newGroupModalOverlay.style.display === 'flex') closeNewGroupModal();
  });

  // Group list — lives inside the drawer, plain always-visible rows
  // (not a dropdown; that got tried in the header and then moved back
  // here, where a second click-to-open step was redundant on top of
  // already opening the drawer). Active group gets a tonal highlight,
  // never the pink accent, which stays reserved for overlap and
  // nowhere else. Each row shows a small "N members" subtitle. Re-run
  // any time groups or the current group changes.
  async function renderGroupSwitcher(groups) {
    // Herds label + list disappear as a unit once there are none —
    // My Shows/Browse Venues/Add a herd (outside this element) stay up
    // regardless, so the nav is never fully blank (see #group-bar).
    document.getElementById('drawer-herds-section').style.display = groups.length ? '' : 'none';

    drawerGroupList.innerHTML = '';
    if (!groups.length) return;

    const counts = await getGroupMemberCounts(groups.map((g) => g.id));

    groups.forEach(g => {
      // Row is a plain div now, not a button — it needs to hold two
      // independent controls (select group / share that group's
      // invite link), and a button can't contain a nested button.
      // The row keeps the card shape (border, radius, padding) that
      // used to live on the button itself.
      const row = document.createElement('div');
      row.className = 'drawer-group-row';
      if (g.id === currentGroupId) row.classList.add('active');

      const selectBtn = document.createElement('button');
      selectBtn.type = 'button';
      selectBtn.className = 'drawer-group-select';

      const name = document.createElement('span');
      name.className = 'group-switch-item-name';
      name.textContent = g.name;
      selectBtn.appendChild(name);

      const count = counts[g.id] || 0;
      const subtitle = document.createElement('span');
      subtitle.className = 'group-switch-item-count';
      subtitle.textContent = `${count} member${count === 1 ? '' : 's'}`;
      selectBtn.appendChild(subtitle);

      selectBtn.addEventListener('click', () => selectGroup(g));
      row.appendChild(selectBtn);

      const shareBtn = document.createElement('button');
      shareBtn.type = 'button';
      shareBtn.className = 'drawer-group-share';
      shareBtn.setAttribute('aria-label', `Share invite link for ${g.name}`);
      shareBtn.innerHTML = '<i data-lucide="share"></i>';
      shareBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const ok = await copyInviteLink(g.slug, g.name, g.id);
        if (ok) flashShareSuccess(shareBtn);
      });
      row.appendChild(shareBtn);

      drawerGroupList.appendChild(row);
    });

    lucide.createIcons({ root: drawerGroupList });

    // Guard against a reported live bug: one herd row occasionally
    // renders in a visibly different, thinner font than its siblings —
    // Public Sans is loaded from Google Fonts with font-display: swap,
    // and WebKit has a known issue where text written via innerHTML
    // while that font is still downloading can get stuck on the
    // fallback font even after the browser finishes loading it and
    // repaints every other on-screen instance correctly. If fonts
    // aren't confirmed ready yet at the moment this list is built,
    // schedule exactly one follow-up re-render for once they are —
    // document.fonts.ready only ever resolves once, so this can't loop.
    if (document.fonts && document.fonts.status !== 'loaded') {
      document.fonts.ready.then(() => renderGroupSwitcher(groups));
    }
  }

  drawerNewGroupBtn.addEventListener('click', handleNewGroup);

  // Which segment of #show-tabs is showing right now — module-level
  // rather than threaded through every render call, since both the
  // herd view and My Shows read/write the same control. Reset to
  // 'upcoming' whenever someone actually switches *context* (a
  // different herd, or into/out of My Shows — see selectGroup and
  // handleMyShowsNavClick below), but left alone across a same-view
  // refresh (a response change, a delete) so flipping to Past and then
  // tapping something doesn't silently snap back to Upcoming.
  let currentShowTab = 'upcoming';

  // Whose personal list is showing inside the current herd — either a
  // person id (your own or another member's), or the literal string
  // 'turnout' for the quorum-gated Turnout chip. Reset to your own id
  // on a real context switch (a different herd — see selectGroup),
  // same reasoning currentShowTab uses. groupMembers is the current
  // herd's member list, refreshed alongside it in renderCurrentView —
  // renderMemberStrip and the per-chip filtering below both read it.
  let currentMemberId = null;
  let groupMembers = [];

  function todayDateStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // Date-only comparison (show_date is a plain 'YYYY-MM-DD' string, no
  // time component to worry about) — a show is "past" once its date
  // is strictly before today, so a show happening later today still
  // reads as upcoming.
  function isPastShow(show) {
    return show.show_date < todayDateStr();
  }

  // "Just added" is about the show, not about anyone's response to
  // it — deliberately not tied to who's seen it or reacted, so it
  // never reads as a status check on any one person. Purely objective
  // (created_at vs. now), same fact for everyone looking at the herd.
  // Three days was a guess at "long enough to actually notice, short
  // enough to stay meaningfully 'new'" — revisit if it feels off once
  // there's real usage to watch.
  const NEW_SHOW_WINDOW_MS = 3 * 24 * 60 * 60 * 1000;
  function isRecentlyAdded(show) {
    if (!show.created_at) return false;
    const addedAt = new Date(show.created_at).getTime();
    if (Number.isNaN(addedAt)) return false;
    return Date.now() - addedAt < NEW_SHOW_WINDOW_MS;
  }

  function syncShowTabButtons() {
    showTabUpcomingBtn.classList.toggle('is-active', currentShowTab === 'upcoming');
    showTabPastBtn.classList.toggle('is-active', currentShowTab === 'past');
  }

  // Re-renders whichever list is actually on screen — a herd, or the
  // cross-group My Shows view — without the tab buttons needing to
  // know which one that is.
  function refreshCurrentShowList() {
    if (currentGroupId) {
      renderCurrentView(currentGroupId);
    } else {
      renderMyShowsView();
    }
  }

  showTabUpcomingBtn.addEventListener('click', () => {
    if (currentShowTab === 'upcoming') return;
    currentShowTab = 'upcoming';
    refreshCurrentShowList();
  });
  showTabPastBtn.addEventListener('click', () => {
    if (currentShowTab === 'past') return;
    currentShowTab = 'past';
    refreshCurrentShowList();
  });

  async function selectGroup(group) {
    currentGroup = group;
    currentGroupId = group.id;
    currentShowTab = 'upcoming';
    currentMemberId = person.id; // default to your own personal list
    myShowsHeadingRow.style.display = 'none';
    groupBar.style.display = 'block';
    drawerMyShowsBtn.classList.remove('active');
    // Leaving Browse (if it was open) for a specific herd — see
    // scripts/browse.js, which owns everything *inside* #browse-view
    // but not this hide-it-and-restore-the-shows-UI step, since that's
    // this function's job everywhere else too (drawerMyShowsBtn etc.).
    document.getElementById('browse-view').style.display = 'none';
    document.getElementById('drawer-browse-btn').classList.remove('active');
    mainContent.style.display = '';
    await renderGroupSwitcher(myGroups);
    closeDrawer();
    // A lone herd is presented as "My Shows" instead of its literal
    // name (e.g. "Dan's Shows") — avoids a page that just repeats
    // what the My Shows tab already says. Share/View still do a real
    // invite/member-list underneath a literal herd, so they're hidden
    // here too — inviting someone doesn't add them to "my" anything,
    // and it doesn't make sense to offer it on a page that isn't
    // presenting itself as a herd at all. Used to swap in a "+" here
    // to start a real herd instead, but that put herd-creation inline
    // on a page whose whole point is "just my shows, no herd stuff" —
    // per direct feedback, that action lives in exactly one place now,
    // the nav drawer's own "Add a herd" button (always present, see
    // #group-bar). The moment a second herd exists this reverts to the normal name
    // + Share/View treatment automatically.
    const isSoloHerd = myGroups.length === 1;
    groupHeadingName.textContent = isSoloHerd ? 'My Shows' : group.name;
    groupShareBtn.style.display = isSoloHerd ? 'none' : '';
    groupViewBtn.style.display = isSoloHerd ? 'none' : '';
    groupHeadingRow.style.display = 'flex';
    await renderCurrentView(group.id);
  }

  let person = null;

  function formatDate(dateStr, timeStr) {
    const d = new Date(`${dateStr}T${timeStr || '00:00'}`);
    const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
    if (!timeStr) return date;
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return `${date} · ${time}`;
  }

  // Single fetch per group — shared by the group view and (via
  // renderMyShowsView's parallel calls) the cross-group My Shows view,
  // so both always read from the same underlying data.
  async function loadGroupData(groupId) {
    const shows = await getShowsForGroup(groupId);
    const showIds = shows.map((s) => s.id);
    const responsesByShow = await getResponsesForShows(showIds);
    return { shows, responsesByShow };
  }

  // A show counts toward Turnout once 2+ people are actually in on
  // it — same threshold "Into it" itself uses to decide whether to
  // show up at all on your own list (see renderShowInteractiveBody).
  // Filters on status defensively — see the matching comment in
  // renderShowInteractiveBody.
  function computeQuorumShows(shows, responsesByShow) {
    return shows.filter((s) => (responsesByShow[s.id] || []).filter((r) => r.status === 'curious').length >= 2);
  }

  // "Is this show on person X's personal list" — true if they created
  // it (every herd starts as a herd of one; the creator is always on
  // their own list) or if they've joined it (a responses row for
  // them — see submitShowDirectly/buildResponseGroup's onJoin).
  function isOnMemberList(show, memberId, responsesByShow) {
    if (show.created_by === memberId) return true;
    return (responsesByShow[show.id] || []).some((r) => r.person_id === memberId && r.status === 'curious');
  }

  // Builds the "My Shows" / Turnout / [each member] chip strip for the
  // current herd — reuses .chip-strip/.chip-strip-item from browse.js's
  // own filter strips (same single-select tap-to-switch interaction,
  // same plain visual treatment — no special color; Turnout is a chip
  // like any other, not an alert). Every member always gets a chip,
  // even with nothing tracked yet (the nav-never-fully-empty rule);
  // Turnout only exists once quorumShows is non-empty, and sits second —
  // right after My Shows, ahead of individual members — since it's the
  // one chip that's actually reporting something happening, not just
  // switching whose list you're looking at. Re-run on every
  // renderCurrentView, same as renderGroupSwitcher, so it always
  // reflects the latest data.
  function renderMemberStrip(quorumShows) {
    herdMemberStrip.style.display = 'flex';
    const others = groupMembers.filter((m) => m.id !== person.id);

    let html = `<button type="button" class="chip-strip-item${currentMemberId === person.id ? ' is-selected' : ''}" data-member="${person.id}">My Shows</button>`;
    if (quorumShows.length > 0) {
      // Count badge — how many shows currently have 2+ people in,
      // not who or how many people. Plain chip styling still applies
      // to the button itself (see the file-header comment above); the
      // badge gets its own small pill rather than any accent color.
      html += `<button type="button" class="chip-strip-item${currentMemberId === 'turnout' ? ' is-selected' : ''}" data-member="turnout">Turnout <span class="chip-count-badge">${quorumShows.length}</span></button>`;
    }
    others.forEach((m) => {
      html += `<button type="button" class="chip-strip-item${currentMemberId === m.id ? ' is-selected' : ''}" data-member="${m.id}">${m.display_name}</button>`;
    });
    herdMemberStrip.innerHTML = html;

    herdMemberStrip.querySelectorAll('[data-member]').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.member === currentMemberId) return;
        currentMemberId = btn.dataset.member;
        currentShowTab = 'upcoming';
        renderCurrentView(currentGroupId);
      });
    });
  }

  // Filters this herd's shows down to whichever chip is selected, then
  // hands off to renderListView. 'own' mode (your own chip) is also
  // what a card's avatar row uses to decide whether to show itself at
  // all — see renderShowInteractiveBody.
  function renderFilteredShows(shows, responsesByShow, quorumShows) {
    turnoutSubhead.style.display = currentMemberId === 'turnout' ? 'block' : 'none';
    if (currentMemberId === 'turnout') {
      renderListView(quorumShows, responsesByShow, 'No turnout yet.', undefined, 'turnout');
      return;
    }
    const viewingSelf = currentMemberId === person.id;
    const visible = shows.filter((s) => isOnMemberList(s, currentMemberId, responsesByShow));
    const member = groupMembers.find((m) => m.id === currentMemberId);
    // "On the radar" nods back to the app's original name — tighter
    // than the first draft ("X hasn't added anything yet.") and reads
    // as a real sentence rather than an apology.
    const emptyMessage = viewingSelf
      ? 'No shows yet.'
      : `Nothing on ${member ? member.display_name + "'s" : 'their'} radar yet.`;
    renderListView(visible, responsesByShow, emptyMessage, undefined, viewingSelf ? 'own' : 'other');
  }

  // The full group list, unfiltered — loaded once per render, then
  // split three ways: the member strip (renderMemberStrip), and
  // whichever chip is currently selected (renderFilteredShows). Add
  // Show is always visible here regardless of which chip is active —
  // it always adds to *your own* list no matter whose you're looking
  // at (see submitShowDirectly, which snaps back to My Shows after).
  async function renderCurrentView(groupId) {
    const { shows, responsesByShow } = await loadGroupData(groupId);
    groupMembers = await getGroupMembers(groupId);
    addShowCard.style.display = 'block';

    const quorumShows = computeQuorumShows(shows, responsesByShow);
    // Fell below quorum since the last render (someone left) while
    // Turnout was the active chip — back to your own list rather than
    // showing a chip that no longer exists.
    if (currentMemberId === 'turnout' && quorumShows.length === 0) {
      currentMemberId = person.id;
    }
    renderMemberStrip(quorumShows);
    renderFilteredShows(shows, responsesByShow, quorumShows);
  }

  // One labeled avatar group — "Into it" is the only one left now that
  // "Can't make it" is gone (see decision log): everyone currently in
  // on a show, plus a fixed slot for my own status that's either a
  // ghost "+" (tap to join) or my filled dot (if I'm already in —
  // tappable to leave again when onLeave is passed, see
  // renderShowInteractiveBody). Clicking anywhere else on the group
  // (label, avatars, my own dot) opens a modal with everyone in it,
  // name + avatar — the ghost "+" and the leavable dot both stop that
  // click from bubbling up, since tapping either is a different action
  // (joining/leaving), not "show me who's here."
  function buildResponseGroup(label, peopleExceptMe, amIIn, joinAriaLabel, onJoin, allPeople, onLeave) {
    const group = document.createElement('div');
    group.className = 'avatar-group';

    const labelEl = document.createElement('div');
    labelEl.className = 'avatar-group-label';
    labelEl.textContent = label;
    group.appendChild(labelEl);

    const row = document.createElement('div');
    row.className = 'avatar-group-row';

    if (peopleExceptMe.length > 0) {
      row.appendChild(buildAvatarDots(peopleExceptMe));
    }

    const mySlot = document.createElement('div');
    mySlot.className = 'avatar-my-slot';

    if (amIIn) {
      const myDot = document.createElement('div');
      myDot.className = 'avatar-dot';
      const myColor = avatarColor(person);
      myDot.style.background = myColor;
      myDot.style.color = contrastTextFor(myColor);
      myDot.textContent = initials(person.display_name);
      // Only wired for a non-creator (onLeave is null for the show's
      // own creator — see renderShowInteractiveBody) — tapping your
      // own dot un-joins the show, symmetric with the ghost "+" that
      // joins it.
      if (onLeave) {
        myDot.classList.add('avatar-dot-leavable');
        myDot.setAttribute('role', 'button');
        myDot.setAttribute('aria-label', "You're in — tap to leave");
        myDot.addEventListener('click', (e) => {
          e.stopPropagation();
          onLeave();
        });
      }
      mySlot.appendChild(myDot);
    } else {
      const ghostAdd = document.createElement('button');
      ghostAdd.type = 'button';
      ghostAdd.className = 'avatar-ghost-add';
      ghostAdd.textContent = '+';
      ghostAdd.setAttribute('aria-label', joinAriaLabel);
      ghostAdd.addEventListener('click', (e) => {
        e.stopPropagation();
        onJoin();
      });
      mySlot.appendChild(ghostAdd);
    }
    row.appendChild(mySlot);

    group.appendChild(row);

    if (allPeople.length > 0) {
      group.classList.add('avatar-group-clickable');
      group.addEventListener('click', () => openPeopleModal(label, allPeople));
    }

    return group;
  }

  // No drill-down page yet — the detail-arrow/onViewDetails hook that
  // used to sit on the headline (and the separate detail page it
  // opened) was cut. Everything worth seeing lives right on the card;
  // revisit a real detail page if that stops being true.
  // Title/venue/openers — the part of a card that's identical whether
  // the show is upcoming (renderShowInteractiveBody) or past
  // (renderShowPastBody below). Pulled out once both needed it rather
  // than copy-pasting; ticket-intent tracking travels with it since
  // that's just DOM+event wiring, not response-state logic.
  function renderShowHeaderInfo(container, show) {
    const titleRow = document.createElement('div');
    titleRow.className = 'show-title-row';
    const titleEl = document.createElement('div');
    titleEl.className = 'show-title';
    titleEl.innerHTML = show.source_url
      ? `<a href="${show.source_url}" target="_blank" rel="noopener">${show.title}</a>`
      : show.title;
    titleRow.appendChild(titleEl);

    // Ticket-intent signal — the show title *is* the buy-tickets link
    // (no separate "Buy Tickets" button exists in this UI), so that's
    // where buy_tickets_clicked lives. Doesn't block the navigation,
    // just observes it.
    if (show.source_url) {
      const ticketLink = titleEl.querySelector('a');
      if (ticketLink) {
        ticketLink.addEventListener('click', () => {
          trackEvent('buy_tickets_clicked', { group_id: show.group_id, show_id: show.id });
        });
      }
    }
    container.appendChild(titleRow);

    // Venue used to have its own line here — moved up into the date
    // badge instead (see buildDateBadge), so it's not repeated twice
    // on the same card. Its link travels with it either way.

    if (show.openers) {
      const openers = document.createElement('div');
      openers.className = 'show-openers';
      openers.textContent = `with ${show.openers}`;
      container.appendChild(openers);
    }
  }

  // Nobody to join, nobody to decline — a past show isn't asking
  // anything of anyone anymore. Reuses .avatar-group's own label/row
  // shape (and the same click-to-open-modal behavior as the live
  // response groups) but with no ghost "+" slot at all, since there's
  // nothing left to join. Requested directly: "forget the in/out just
  // show who went thats a good simple solution for the nostalgia
  // piece" — "who went" here means whoever marked themselves curious
  // before the show happened; there's no separate real-world
  // attendance record, this is the honest best-available signal.
  function buildWhoWentGroup(people) {
    const group = document.createElement('div');
    group.className = 'avatar-group';

    const labelEl = document.createElement('div');
    labelEl.className = 'avatar-group-label';
    labelEl.textContent = people.length ? 'Who went' : 'Nobody marked as going';
    group.appendChild(labelEl);

    if (people.length > 0) {
      const row = document.createElement('div');
      row.className = 'avatar-group-row';
      row.appendChild(buildAvatarDots(people));
      group.appendChild(row);

      group.classList.add('avatar-group-clickable');
      group.addEventListener('click', () => openPeopleModal('Who went', people));
    }

    return group;
  }

  // Past-show card body — swapped in by renderListView once a show's
  // date has passed. See buildWhoWentGroup above for why this drops
  // the curious/out toggle entirely instead of just disabling it.
  function renderShowPastBody(container, show, responses) {
    container.innerHTML = '';
    renderShowHeaderInfo(container, show);

    const avatarRow = document.createElement('div');
    avatarRow.className = 'show-card-avatars';
    const went = responses.filter((r) => r.status === 'curious').map((r) => r.people);
    avatarRow.appendChild(buildWhoWentGroup(went));
    container.appendChild(avatarRow);
  }

  // alwaysShowAvatars — false only when this card is sitting on your
  // own personal list (see renderFilteredShows' 'own' mode): a show
  // you created that nobody's joined yet shows no avatar row at all,
  // since "Into it: you" tells you nothing you didn't already know.
  // The moment a second person joins, it appears for everyone,
  // creator included. Browsing anyone else's list, or Turnout, always
  // shows it — that's the actual discovery surface "want in" happens
  // from, so it can't wait for a quorum that hasn't happened yet.
  // Used to be two groups side by side ("Into it" + "Can't make it");
  // the decline half is gone entirely now — see decision log, personal
  // lists replace the shared herd list — so there's exactly one group
  // left, matching the same "reaction, not status" register "Into it"
  // always had.
  function renderShowInteractiveBody(container, show, responses, onResponseChange, alwaysShowAvatars) {
    const mine = responses.find((r) => r.person_id === person.id);
    const amIIn = !!mine;
    const isCreator = show.created_by === person.id;
    // Filters on status defensively (rather than trusting responses is
    // already 'curious'-only) so this keeps working correctly even if
    // the app deploys before the drop-out-status migration runs against
    // the live database.
    const interested = responses.filter((r) => r.status === 'curious');

    container.innerHTML = '';
    renderShowHeaderInfo(container, show);

    if (!alwaysShowAvatars && interested.length < 2) {
      return;
    }

    const avatarRow = document.createElement('div');
    avatarRow.className = 'show-card-avatars';

    const curiousExceptMe = interested.filter((r) => r.person_id !== person.id).map((r) => r.people);

    avatarRow.appendChild(buildResponseGroup(
      'Into it',
      curiousExceptMe,
      amIIn,
      "I want in",
      async () => {
        const ok = await setResponse(show.id, person.id, 'curious');
        if (ok) {
          // interested.length is the count *before* this tap, and
          // excludes the actor (the ghost "+" only shows when they
          // aren't in yet). New total is interested.length + 1;
          // overlap_reached fires only on the exact 1→2 transition —
          // also the exact moment Turnout would first pick this show
          // up — so it stays a true one-time-per-show signal, not a
          // running counter.
          trackEvent('curious_tapped', { group_id: show.group_id, show_id: show.id });
          if (interested.length === 1) {
            trackEvent('overlap_reached', { group_id: show.group_id, show_id: show.id, overlap_count: 2 });
          }
          await onResponseChange();
        }
      },
      interested.map((r) => r.people),
      // No leave affordance for the show's own creator — their dot is
      // just "you," not a toggle; deleting the show is their
      // equivalent of backing out. Everyone else can tap their own dot
      // to un-join.
      isCreator ? null : async () => {
        const ok = await removeResponse(show.id, person.id);
        if (ok) {
          trackEvent('show_left', { group_id: show.group_id, show_id: show.id });
          await onResponseChange();
        }
      }
    ));

    container.appendChild(avatarRow);
  }

  // Plain text, no pill — see .show-date-badge in components.css.
  // Venue rides along here now too (date + venue is the natural "when
  // and where" pair for scanning a long list), rather than repeating
  // it in its own line further down the card — see the comment in
  // renderShowHeaderInfo. Still a real link when the venue has one,
  // same "venue links to its own calendar" behavior as before, just
  // relocated. "Just added" moved *out* of this badge and into
  // buildCardTopRow below, so this stays just the one "when/where"
  // fact and doesn't get crowded with a third thing.
  function buildDateBadge(show) {
    const badge = document.createElement('div');
    badge.className = 'show-date-badge';
    let html = formatDate(show.show_date, show.show_time);
    if (show.venue_name) {
      const venueHtml = show.venue_url
        ? `<a href="${show.venue_url}" target="_blank" rel="noopener">${show.venue_name}</a>`
        : show.venue_name;
      html += ` · ${venueHtml}`;
    }
    badge.innerHTML = html;
    return badge;
  }

  // Remove a show entirely — only ever rendered for the person who
  // added it (see the created_by check in renderListView, which wraps
  // this in buildDeleteActionSlot and appends it to the card's avatar
  // row — .show-card-avatars — as its last child; see that function's
  // own comment for why it needs the extra wrapper rather than just
  // dropping the button in directly). Confirms via a plain
  // window.confirm() before deleting, same "reach for the browser's
  // own primitive" approach the Leave herd button already uses — this
  // app has no destructive-red token anywhere, so a ghost icon button
  // plus a native confirm is the whole affordance, no custom modal.
  function buildDeleteButton(show, refresh) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'show-delete-btn';
    btn.setAttribute('aria-label', 'Remove show');
    btn.innerHTML = '<i data-lucide="trash-2"></i>';
    lucide.createIcons({ root: btn });

    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!window.confirm(`Remove "${show.title}"? This can't be undone.`)) return;

      btn.disabled = true;
      const ok = await OTR.deleteShow(show.id);
      if (!ok) {
        btn.disabled = false;
        return;
      }
      trackEvent('show_deleted', { group_id: show.group_id, show_id: show.id });
      refresh();
    });

    return btn;
  }

  // Wraps the delete button in the exact same label+row shape
  // .avatar-group uses (empty, visibility:hidden label on top, a real
  // row below) so it sits at the same vertical position as the
  // curious/can't-make-it avatar dots and ghost-add circle beside it —
  // not just centered against the avatar row as a whole, which still
  // reads as floating since that row is taller than the dots alone
  // (it also carries the "HECK YEAH!"/"CAN'T MAKE IT" label above
  // them). Per direct feedback after the first pass ("still floating
  // in this image, it should be centered with the plus icon and
  // avatar initials") — aligning to the row's full height wasn't
  // enough, it needed to match the dots' own baseline specifically.
  function buildDeleteActionSlot(show, refresh) {
    const slot = document.createElement('div');
    slot.className = 'avatar-group show-delete-slot';

    const spacer = document.createElement('div');
    spacer.className = 'avatar-group-label';
    spacer.setAttribute('aria-hidden', 'true');
    spacer.style.visibility = 'hidden';
    spacer.textContent = ' ';
    slot.appendChild(spacer);

    const row = document.createElement('div');
    row.className = 'avatar-group-row';
    row.appendChild(buildDeleteButton(show, refresh));
    slot.appendChild(row);

    return slot;
  }

  // Card header row — date+venue on the left (buildDateBadge), "Just
  // added" on the right. Delete lives in its own footer slot instead
  // (see buildDeleteActionSlot) — this row is just the two "what is
  // this and when" facts, nothing that acts on the show. The
  // collapse/expand chevron that used to live here belonged to the
  // "not going" collapsed-card state, which is gone entirely now that
  // there's no decline to collapse (see decision log). mine — this
  // person's own response row, if any; "Just added" only shows before
  // they've responded at all. Responding is itself the clearest signal
  // you've seen it, so the badge disappears right then rather than
  // waiting out the full window. Purely per-viewer — someone else's
  // card still shows it until *they* respond, same as every other
  // personal-response state in this app.
  function buildCardTopRow(show, mine) {
    const row = document.createElement('div');
    row.className = 'show-card-top-row';
    row.appendChild(buildDateBadge(show));

    const right = document.createElement('div');
    right.className = 'show-card-top-right';

    if (!mine && isRecentlyAdded(show)) {
      const badge = document.createElement('span');
      badge.className = 'show-new-badge';
      badge.textContent = 'Just added';
      right.appendChild(badge);
    }

    if (right.children.length > 0) row.appendChild(right);

    return row;
  }

  // Empty stage, waiting for a show — a flat, single-color guitar
  // silhouette (headstock, neck, figure-8 body from two overlapping
  // filled circles, soundhole punched through with the page's own
  // background color), used for every "nothing here yet" moment: no
  // shows, no shows in this tab, no group yet. Flat fill, no
  // gradient/shadow, per the brand's flat-full-stop rule.
  const EMPTY_STATE_ICON = '<svg viewBox="0 0 64 64"><rect x="27" y="2" width="10" height="9" rx="2" fill="currentColor"/><rect x="30" y="10" width="4" height="24" fill="currentColor"/><circle cx="32" cy="37" r="9" fill="currentColor"/><circle cx="32" cy="50" r="12" fill="currentColor"/><circle cx="32" cy="43" r="3.5" fill="var(--color-bg)"/></svg>';

  function renderEmptyState(container, message) {
    container.className = 'show-list-empty';
    // Icon + message sit inside a big darker circle now, per direct
    // feedback — the circle is its own element (not just a background
    // on .show-list-empty) so it can stay solid/undimmed while the
    // icon and message keep their own quieter, dimmed treatment on
    // top of it (see .show-list-empty-circle in components.css).
    container.innerHTML = `<div class="show-list-empty-circle"><div class="show-list-empty-icon">${EMPTY_STATE_ICON}</div><div class="show-list-empty-message">${message}</div></div>`;
  }

  // Zero-herd landing (the old three-tile Browse/Add Show/Start Herd
  // placemat) is gone — per direct feedback ("I just dont like that
  // state where we have the three buttons. its dumb"), having a herd
  // is no longer optional. Every person always has at least one herd,
  // defaulting to a herd-of-one presented as "My Shows" (see the
  // isSoloHerd branch in selectGroup) — so there's nothing left for a
  // zero-groups state to show. ensureHerdExists() is what guarantees
  // that: called anywhere myGroups could otherwise end up empty (fresh
  // person with no invite link, or leaving your last remaining herd),
  // it silently creates a default-named herd (editable later, same
  // rename path every herd already has) rather than presenting a
  // choice screen.
  async function ensureHerdExists() {
    const defaultName = `${person.display_name}'s Shows`;
    const group = await createGroup(person.id, defaultName);
    if (!group) return null;
    trackEvent('group_created', { group_id: group.id, via: 'auto_solo' });
    myGroups = await getMyGroups(person.id);
    return group;
  }

  // onChange defaults to the single-context refresh every caller
  // wants — renderCurrentView for a herd's own strip, or the cross-
  // group All Shows view's own renderMyShowsView (see below), which
  // needs to re-run its aggregate fetch instead. mode controls the
  // card body: 'own' hides a card's avatar row until 2+ people are in
  // (see renderShowInteractiveBody), 'other'/'turnout' always show it;
  // omitted (the cross-group All Shows call) behaves like 'own', since
  // that view is always *your* personal picks too, just merged across
  // every herd. #show-tabs only ever shows on the cross-group All
  // Shows view — a herd's own page (whichever chip is selected)
  // quietly stays upcoming-only with no tab UI at all, same as before
  // this redesign. currentGroupId is reliably null exactly when All
  // Shows is the active context, so that's what decides it. A past
  // show still gets the non-interactive "who went" body wherever it's
  // shown.
  function renderListView(shows, responsesByShow, emptyMessage, onChange, mode) {
    const content = listContent;
    const refresh = onChange || (() => renderCurrentView(currentGroupId));
    const effectiveMode = mode || 'own';

    const tabsHere = !currentGroupId;
    showTabs.style.display = tabsHere ? 'flex' : 'none';
    if (tabsHere) syncShowTabButtons();

    const isPastTab = tabsHere && currentShowTab === 'past';
    const visible = isPastTab
      ? shows.filter(isPastShow).slice().sort((a, b) => (b.show_date || '').localeCompare(a.show_date || ''))
      : shows.filter((s) => !isPastShow(s));

    if (visible.length === 0) {
      renderEmptyState(content, isPastTab ? 'No past shows yet.' : (emptyMessage || 'No shows yet.'));
      return;
    }

    content.className = '';
    content.innerHTML = '';

    visible.forEach((show) => {
      const responses = responsesByShow[show.id] || [];
      const mine = responses.find((r) => r.person_id === person.id);

      const card = document.createElement('div');
      card.className = 'show-card';

      card.appendChild(buildCardTopRow(show, mine));

      const body = document.createElement('div');
      card.appendChild(body);

      if (isPastTab) {
        renderShowPastBody(body, show, responses);
      } else {
        const alwaysShowAvatars = effectiveMode === 'other' || effectiveMode === 'turnout';
        renderShowInteractiveBody(body, show, responses, refresh, alwaysShowAvatars);
      }

      // Delete lives inline at the end of the avatar row — lined up
      // with the avatar dots/ghost-add circle themselves, not just the
      // row as a whole (see buildDeleteActionSlot's own comment for
      // why that distinction needed its own wrapper). When there's no
      // avatar row at all (an own-list card nobody's joined yet — see
      // renderShowInteractiveBody), that alignment trick has nothing to
      // line up against, so it gets its own plain right-aligned row
      // instead — still bottom-right on the card, not stuck to the
      // card's own default (left) flow.
      if (show.created_by === person.id) {
        const avatarsRow = body.querySelector('.show-card-avatars');
        if (avatarsRow) {
          avatarsRow.appendChild(buildDeleteActionSlot(show, refresh));
        } else {
          const deleteOnlyRow = document.createElement('div');
          deleteOnlyRow.className = 'show-card-avatars show-card-delete-only';
          deleteOnlyRow.appendChild(buildDeleteButton(show, refresh));
          body.appendChild(deleteOnlyRow);
        }
      }

      content.appendChild(card);
    });
  }

  // Collapses shows that match OTR.findMatchingShow's rule (same
  // normalized title + date, venue only compared when both sides have
  // one) down to a single canonical row, unioning every matched show's
  // responses onto that row's id in responsesByShow (deduped by
  // person — the same person could in principle be in more than one of
  // the matched herds and show up on more than one of the rows). Only
  // used by the cross-group All Shows view (see renderMyShowsView);
  // a single herd's own list never needs this, since findMatchingShow
  // already prevents the duplicate from being created there in the
  // first place (see submitShowDirectly).
  function mergeAcrossHerds(shows, responsesByShow) {
    const canonical = [];
    shows.forEach((show) => {
      const match = OTR.findMatchingShow(canonical, show);
      if (!match) {
        canonical.push(show);
        return;
      }
      const combined = responsesByShow[match.id] || [];
      const seenPeople = new Set(combined.map((r) => r.person_id));
      (responsesByShow[show.id] || []).forEach((r) => {
        if (seenPeople.has(r.person_id)) return;
        seenPeople.add(r.person_id);
        combined.push(r);
      });
      responsesByShow[match.id] = combined;
    });
    return canonical;
  }

  // Cross-group "My Shows" — every show, in every group this person
  // is a member of, that they've personally marked curious. Fetches
  // per-group (loadGroupData already exists for the single-group
  // case) in parallel, then flattens into one sorted list rather than
  // adding a dedicated cross-group query — myGroups is already loaded
  // client-side, and this only runs when someone actually opens the
  // view, not on every render.
  async function renderMyShowsView() {
    trackEvent('my_shows_viewed', {});
    currentGroupId = null;
    currentGroup = null;
    drawerMyShowsBtn.classList.add('active');
    // Leaving Browse (if it was open) — see the matching comment in
    // selectGroup() above.
    document.getElementById('browse-view').style.display = 'none';
    document.getElementById('drawer-browse-btn').classList.remove('active');
    mainContent.style.display = '';
    herdMemberStrip.style.display = 'none'; // no single herd's member list applies here
    turnoutSubhead.style.display = 'none'; // Turnout is a herd-page-only concept
    await renderGroupSwitcher(myGroups);
    closeDrawer();

    groupHeadingRow.style.display = 'none';
    addShowCard.style.display = 'none';
    myShowsHeadingRow.style.display = 'flex';

    const perGroup = await Promise.all(
      myGroups.map(async (g) => ({ group: g, ...(await loadGroupData(g.id)) }))
    );

    const mergedResponses = {};
    let myShows = [];
    perGroup.forEach(({ shows, responsesByShow }) => {
      Object.assign(mergedResponses, responsesByShow);
      shows.forEach((s) => {
        const mine = (responsesByShow[s.id] || []).find(
          (r) => r.person_id === person.id && r.status === 'curious'
        );
        if (mine) myShows.push(s);
      });
    });
    // The same real-world show can exist as two independent rows if it
    // was added separately in two different herds — Add Show's own
    // duplicate-join only ever checks within one herd at a time (see
    // findMatchingShow's own scope note), so those never got caught
    // there. Collapse them into one card here instead, reusing the
    // exact same matching rule (title + date, venue only when both
    // sides have one) rather than a second definition of "same show."
    // No herd tag on the result anymore either — once a card can
    // represent more than one herd at once, naming just one of them
    // stopped being accurate, so it's just gone rather than picking
    // one arbitrarily.
    myShows = mergeAcrossHerds(myShows, mergedResponses);
    myShows.sort((a, b) => (a.show_date || '').localeCompare(b.show_date || ''));

    // mode omitted — behaves like 'own' (avatar row hidden until 2+
    // people are in), which is correct here since every card on this
    // view is by definition something *you* marked curious.
    renderListView(
      myShows,
      mergedResponses,
      'No shows marked yet.',
      () => renderMyShowsView()
    );
  }

  // Wraps renderMyShowsView for the actual nav click only — internal
  // refreshes (the onChange passed into renderListView above) call
  // renderMyShowsView() directly instead, so those don't reset
  // currentShowTab back to Upcoming (see the comment on
  // currentShowTab up near selectGroup).
  function handleMyShowsNavClick() {
    currentShowTab = 'upcoming';
    renderMyShowsView();
  }
  drawerMyShowsBtn.addEventListener('click', handleMyShowsNavClick);

  // Opens the New herd modal (see openNewGroupModal above) — actual
  // group creation now happens in that modal's own form submit
  // handler, not here. Kept as a named function (rather than wiring
  // openNewGroupModal directly to the button) so the click listener
  // below reads the same way every other drawerNewGroupBtn-adjacent
  // handler in this file does.
  function handleNewGroup() {
    openNewGroupModal();
  }

  // Processes ?g=<slug> from a shared invite link: looks up the group
  // and adds the person to it. Safe to no-op (bad slug, no param, or
  // already a member) — the URL param is cleaned up either way so a
  // page refresh doesn't keep re-processing it.
  async function handleGroupJoinFromUrl(personId) {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('g');
    if (!slug) return null;

    // Cleans up to "/" specifically, not window.location.pathname --
    // same reasoning as copyInviteLink() above, so an invite visitor
    // lands on the clean canonical URL after the ?g= param is
    // stripped, regardless of whether the link they clicked pointed
    // at "/" or "/index.html".
    window.history.replaceState({}, '', '/');

    const group = await getGroupBySlug(slug);
    if (!group) return null;

    await joinGroup(personId, group.id);
    // Note: joinGroup upserts with ignoreDuplicates, so this fires on
    // every visit via an invite link, not just the first — Supabase
    // doesn't tell us whether the upsert actually inserted a new row.
    // Slightly overcounts if the same person reopens an old invite
    // link, but undercounting a first join would be worse; revisit if
    // invite_accepted volume looks inflated relative to invite_sent.
    trackEvent('invite_accepted', { group_id: group.id });
    return group;
  }

  // Colors both places "you" show up as a filled dot (drawer avatar,
  // header trigger) with your chosen color, and (re)builds the swatch
  // picker with the current choice ringed. Called on load and again
  // any time the color changes, since a change also has to ripple out
  // to every show card's avatar row (handled by the caller re-running
  // renderCurrentView after this).
  function renderMyAvatarChrome() {
    const color = avatarColor(person);
    const textColor = contrastTextFor(color);
    drawerAvatar.style.setProperty('--avatar-color', color);
    drawerAvatar.style.color = textColor;
    drawerAvatar.textContent = initials(person.display_name);
    hamburgerBtn.style.setProperty('--avatar-color', color);
    hamburgerBtn.style.color = textColor;
    headerAvatarInitials.textContent = initials(person.display_name);
    // Feeds .drawer-identity-section's dual-tone glow (see
    // components.css) — same custom property already applied to the
    // drawer avatar and header trigger, just also set on the identity
    // section itself now so its background gradient tracks whichever
    // color is currently chosen.
    drawerIdentitySection.style.setProperty('--avatar-color', color);

    avatarColorPicker.innerHTML = '';
    AVATAR_COLORS.forEach((c) => {
      const swatch = document.createElement('button');
      swatch.type = 'button';
      swatch.className = 'avatar-color-swatch' + (color === c.hex ? ' active' : '');
      swatch.style.background = c.hex;
      swatch.setAttribute('aria-label', c.name);
      swatch.addEventListener('click', async () => {
        if (avatarColor(person) === c.hex) return;
        const ok = await updatePersonColor(person.id, c.hex);
        if (!ok) return;
        person.avatar_color = c.hex;
        renderMyAvatarChrome();
        if (currentGroupId) await renderCurrentView(currentGroupId);
      });
      avatarColorPicker.appendChild(swatch);
    });
  }

  // Click the avatar, or the name + pencil icon beside it, to open/
  // close the name + color edit panel below — collapsed by default
  // now (see the drawer-identity-edit HTML comment for why), so
  // opening it always starts from the current name rather than
  // whatever was left typed in from last time. Two separate triggers
  // (can't nest a button in a button) toggle the same shared state.
  function setIdentityEditOpen(open) {
    drawerIdentityEdit.style.display = open ? 'block' : 'none';
    drawerAvatar.setAttribute('aria-expanded', open ? 'true' : 'false');
    drawerNameBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) drawerNameInput.value = person.display_name;
  }

  function toggleIdentityEdit() {
    const isOpen = drawerIdentityEdit.style.display !== 'none';
    setIdentityEditOpen(!isOpen);
    if (!isOpen) drawerNameInput.focus();
  }

  drawerAvatar.addEventListener('click', toggleIdentityEdit);
  drawerNameBtn.addEventListener('click', toggleIdentityEdit);

  // Saves on blur, not on every keystroke — Enter just blurs (no
  // actual form here, so no submit event to hook), same "commit on
  // leave" pattern as any plain text field without its own button.
  async function saveNameIfChanged() {
    const newName = drawerNameInput.value.trim();
    if (!newName || newName === person.display_name) {
      drawerNameInput.value = person.display_name;
      return;
    }
    const ok = await updatePersonName(person.id, newName);
    if (!ok) return;
    person.display_name = newName;
    drawerName.textContent = newName;
    renderMyAvatarChrome();
    if (currentGroupId) await renderCurrentView(currentGroupId);
  }

  drawerNameInput.addEventListener('blur', saveNameIfChanged);
  drawerNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      drawerNameInput.blur();
    }
  });

  async function afterPerson() {
    // person_id as a GA4 user property (not group_id — a person moves
    // between groups over time, so group_id travels as a per-event
    // param instead; see analytics plan). Cookie identity is already
    // the source of truth here, this just lets us segment by it in GA.
    if (typeof gtag === 'function') {
      gtag('set', 'user_properties', { person_id: person.id });
    }

    drawerName.textContent = person.display_name;
    renderMyAvatarChrome();

    const joinedGroup = await handleGroupJoinFromUrl(person.id);
    myGroups = await getMyGroups(person.id);

    if (myGroups.length === 0) {
      // Brand-new person, no invite link, didn't name a herd on the
      // name gate — herds are required now, so give them the default
      // herd-of-one instead of a choice screen. See ensureHerdExists().
      const solo = await ensureHerdExists();
      if (!solo) return;
      await selectGroup(solo);
      return;
    }

    const targetGroup = myGroups.find((g) => g.id === joinedGroup?.id) || myGroups[0];
    await selectGroup(targetGroup);
  }

  async function init() {
    person = await getPerson();

    if (!person) {
      siteHeader.style.display = 'none';
      mainContent.style.display = 'none';
      nameGate.style.display = 'block';
      nameGateGroupRow.style.display = hasInviteSlug ? 'none' : 'block';

      // Invite-link visitor: name the actual group they're about to
      // join, as a second line under the brand tagline (not a
      // replacement for it) — so the raw ?g=<slug> in the URL bar
      // isn't the only context they get. Looked up separately from
      // (and before) handleGroupJoinFromUrl's own getGroupBySlug call,
      // which only runs after they've entered a name — this is purely
      // for the copy, doesn't join anything. Stays hidden on a stale/
      // bad slug rather than claiming an invite that doesn't check out.
      if (hasInviteSlug) {
        const invitedGroup = await getGroupBySlug(inviteSlug);
        if (invitedGroup) {
          nameGateInviteMessage.textContent = `You've been invited to join "${invitedGroup.name}" to track shows together. Add your name and jump in.`;
          nameGateInviteMessage.style.display = 'block';
        }
      }
      return;
    }

    await afterPerson();
  }

  // Reveals the normal app shell and runs the usual post-person setup
  // (join-by-slug if applicable, load groups, select one).
  async function enterAppFromGate() {
    nameGate.style.display = 'none';
    siteHeader.style.display = '';
    mainContent.style.display = '';
    // Whatever scroll position the page was at while the name gate was
    // showing (e.g. the on-screen keyboard nudging things around while
    // typing a group name) doesn't reset itself just because the DOM
    // underneath it changed — the browser keeps the same scrollY, which
    // can leave the header out of view the instant the real app
    // appears. Explicit reset, not a guess: per direct feedback, the
    // header should never load out of view on first entry.
    window.scrollTo(0, 0);
    await afterPerson();
  }

  nameGateForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name-gate-input').value.trim();
    if (!name) return;

    person = await createPerson(name, randomAvatarColor());
    if (!person) return;

    if (hasInviteSlug) {
      // Joining a group that already exists — nothing left to set up.
      await enterAppFromGate();
      return;
    }

    // Cold start: the group-name field was right there in the same
    // form, so create it now instead of a separate step. Used to drop
    // into a "you're in, share the link" interstitial screen here —
    // cut per direct feedback (felt like an unnecessary extra beat);
    // straight into the app now, same as the invite-link path. The
    // group heading row's share icon and the drawer's per-group share
    // icon both still cover "grab the invite link," just not as a
    // forced first stop.
    const groupName = document.getElementById('name-gate-group-input').value.trim();
    if (groupName) {
      const group = await createGroup(person.id, groupName);
      if (group) trackEvent('group_created', { group_id: group.id, via: 'cold_start' });
    }
    await enterAppFromGate();
  });

  // Swaps every static <i data-lucide="..."> placeholder already in
  // the initial HTML (drawer close, modal close, group heading share)
  // for its real inline SVG. Dynamically-rendered icons (the per-group
  // share buttons in the drawer) get their own scoped call inside
  // renderGroupSwitcher(), since createIcons() only sees elements
  // that exist in the DOM at the moment it runs.
  lucide.createIcons();

  init();

  // Nav drawer open/close — hamburger, close button, overlay click,
  // and Escape all close it; body scroll locks while it's open so
  // background content doesn't scroll behind it.
  function openDrawer() {
    navDrawer.classList.add('open');
    drawerOverlay.classList.add('open');
    navDrawer.setAttribute('aria-hidden', 'false');
    hamburgerBtn.setAttribute('aria-expanded', 'true');
    document.body.classList.add('drawer-open');
  }
  function closeDrawer() {
    navDrawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
    navDrawer.setAttribute('aria-hidden', 'true');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('drawer-open');
    setIdentityEditOpen(false);
  }
  hamburgerBtn.addEventListener('click', openDrawer);
  drawerCloseBtn.addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });

  // ===== Add show: two entry methods (search, manual), funneling into
  // the same manual form for review before submit. "Paste a link" was
  // cut — one fewer entry point, search covers the common case. =====

  function resetAddShowPanel() {
    addShowForm.reset();
    addShowForm.style.display = 'none';

    artistSearchInput.value = '';
    artistSearchStatus.textContent = '';
    artistSearchResults.innerHTML = '';
    artistSearchResults.style.display = 'none';

    venueSearchResults.innerHTML = '';
    venueSearchResults.style.display = 'none';
    selectedVenueUrl = null;
    selectedSourceUrl = null;

    document.getElementById('search-method-row').style.display = 'block';

    closeAddShowModal();
  }

  function revealManualForm(prefill) {
    document.getElementById('show-title').value = prefill?.title || '';
    document.getElementById('show-date-input').value = prefill?.show_date || '';
    venueNameInput.value = prefill?.venue_name || '';
    selectedVenueUrl = prefill?.venue_url || null;
    selectedSourceUrl = prefill?.source_url || null;
    addShowForm.style.display = 'block';
    addShowForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Used when search already has enough to create the show outright
  // (title + date) — no review form, just add it. Falls back to the
  // form if the data turns out to be incomplete.
  async function submitShowDirectly(fields, source) {
    if (!currentGroupId) return;
    if (!fields.title || !fields.show_date) {
      revealManualForm(fields);
      return;
    }

    // Duplicate check — re-fetch the group's current shows rather than
    // trusting whatever's left over from the last render, so a show
    // someone else added seconds ago still gets caught. If it matches
    // (see OTR.findMatchingShow), join the existing card instead of
    // creating a second one: the first adder stays created_by/owner
    // (unchanged — nothing about ownership needed to change, shows
    // already had this), the new person just gets a 'curious' response
    // on that same show, and the two cards that would've split the
    // overlap signal in half instead stay one card with two names on
    // it, which is the whole point of the app.
    const { shows: currentShows, responsesByShow } = await loadGroupData(currentGroupId);
    const existing = OTR.findMatchingShow(currentShows, fields);

    if (existing) {
      const alreadyIn = (responsesByShow[existing.id] || []).some(
        (r) => r.person_id === person.id && r.status === 'curious'
      );
      await setResponse(existing.id, person.id, 'curious');
      trackEvent('show_add_deduped', { group_id: existing.group_id, show_id: existing.id, source: source || 'manual' });
      if (!alreadyIn) {
        trackEvent('curious_tapped', { group_id: existing.group_id, show_id: existing.id, via: 'duplicate_join' });
      }

      if (existing.created_by === person.id) {
        showToast('You already added that one!');
      } else if (alreadyIn) {
        showToast('You’re already in on that one!');
      } else {
        const adderResponse = (responsesByShow[existing.id] || []).find(
          (r) => r.person_id === existing.created_by
        );
        const adderName = adderResponse?.people?.display_name || 'someone in your herd';
        // Same wording either way someone ends up on this card now —
        // whether the app auto-detected a match here or they tapped
        // "I want in" browsing {adderName}'s own list, both are the
        // same underlying action (see buildResponseGroup's onJoin).
        showToast(`Nice, ${adderName} already added that — you're in!`);
      }

      // Land back on your own list so the join is actually visible —
      // otherwise you'd stay wherever the Add Show panel was opened
      // from (which might be a friend's or Turnout's chip) and not see
      // the result.
      currentMemberId = person.id;
      resetAddShowPanel();
      await renderCurrentView(currentGroupId);
      return;
    }

    const show = await createShow(currentGroupId, person.id, fields);
    if (show) {
      trackEvent('show_added', { group_id: show.group_id, show_id: show.id, source: source || 'manual' });
      // Adding a show is itself a "curious" signal — without this the
      // person who just added it wouldn't be "in" on their own show at
      // all. Not counted toward overlap_reached here since nobody else
      // can possibly be curious yet on a show that was just created —
      // the 1→2 transition logic in renderShowInteractiveBody only
      // applies there, not to this auto-join.
      await setResponse(show.id, person.id, 'curious');
      trackEvent('curious_tapped', { group_id: show.group_id, show_id: show.id, via: 'show_creation' });
      currentMemberId = person.id;
      resetAddShowPanel();
      await renderCurrentView(currentGroupId);
    }
  }

  // Same button both opens and closes now — toggle based on whether
  // the card's already open.
  addShowBtn.addEventListener('click', () => {
    if (addShowCard.classList.contains('is-open')) {
      resetAddShowPanel();
    } else {
      openAddShowModal();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && addShowCard.classList.contains('is-open')) resetAddShowPanel();
  });

  cancelAddShow.addEventListener('click', resetAddShowPanel);

  // Method switching
  showManualMethodBtn.addEventListener('click', () => {
    revealManualForm(null);
  });

  // Method 1: artist search (Ticketmaster, New England)
  artistSearchBtn.addEventListener('click', async () => {
    const keyword = artistSearchInput.value.trim();
    if (!keyword) return;

    artistSearchStatus.textContent = 'Searching…';
    artistSearchResults.style.display = 'none';
    artistSearchResults.innerHTML = '';

    const results = await searchShows(keyword);

    if (results.length === 0) {
      artistSearchStatus.textContent = 'No shows found — try adding manually.';
      return;
    }

    artistSearchStatus.textContent = `${results.length} show${results.length === 1 ? '' : 's'} found`;
    artistSearchResults.style.display = 'block';

    results.forEach((show) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'search-result-item';
      item.innerHTML = `
        <div class="result-title">${show.title || 'Untitled show'}</div>
        <div class="result-meta">${show.show_date || 'No date'}${show.venue_name ? ' · ' + show.venue_name : ''}</div>
      `;
      item.addEventListener('click', () => submitShowDirectly(show, 'ticketmaster'));
      artistSearchResults.appendChild(item);
    });
  });

  // Venue-name autocomplete — debounced lookup against Ticketmaster's
  // venue directory. Picking a suggestion silently attaches its venue
  // link; there's no visible link field for it to appear in.
  venueNameInput.addEventListener('input', () => {
    selectedVenueUrl = null;
    clearTimeout(venueSearchTimer);

    const keyword = venueNameInput.value.trim();
    if (keyword.length < 3) {
      venueSearchResults.style.display = 'none';
      venueSearchResults.innerHTML = '';
      return;
    }

    venueSearchTimer = setTimeout(async () => {
      const venues = await searchVenues(keyword);
      venueSearchResults.innerHTML = '';

      if (venues.length === 0) {
        venueSearchResults.style.display = 'none';
        return;
      }

      venues.forEach((v) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'search-result-item';
        item.innerHTML = `
          <div class="result-title">${v.name}</div>
          ${v.city ? `<div class="result-meta">${v.city}</div>` : ''}
        `;
        item.addEventListener('click', () => {
          venueNameInput.value = v.name;
          selectedVenueUrl = v.url;
          venueSearchResults.style.display = 'none';
          venueSearchResults.innerHTML = '';
        });
        venueSearchResults.appendChild(item);
      });

      venueSearchResults.style.display = 'block';
    }, 300);
  });

  // Method 2: manual submit — used for plain manual entry, and as the
  // fallback when search didn't have enough to add the show outright.
  addShowForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fields = {
      title: document.getElementById('show-title').value.trim(),
      show_date: document.getElementById('show-date-input').value,
      venue_name: venueNameInput.value.trim(),
      venue_url: selectedVenueUrl,
      source_url: selectedSourceUrl,
    };
    await submitShowDirectly(fields, 'manual');
  });
</script>

<!-- Browse Venues — loaded after the main script above so it can
     reference that script's top-level consts/functions directly
     (mainContent, trackEvent, openDrawer, closeDrawer), the same way
     every classic <script> tag here shares one global scope. venues.js
     just defines OTR.VENUES (static data); browse.js does the rest. -->
<script src="data/venues.js"></script>
<script src="scripts/browse.js"></script>

</body>
</html>
