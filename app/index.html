<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On the Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/grid.css">
<link rel="stylesheet" href="styles/components.css">
<!-- Supabase UMD build — plain global script, not a module, so this
     keeps working when the file is opened directly (file://). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ===== Name gate ===== -->
<!-- Shown only when this browser has no person cookie yet — a plain
     on-page form, not a window.prompt(). Header + main stay hidden
     until this is submitted, then init() continues as normal. This
     is the whole "splash page" — no separate marketing screen, just
     the same shell with a name field in front of it. -->
<div id="name-gate" style="display:none;">
  <div class="container" style="padding-block: var(--space-56);">
    <div class="row">
      <div class="col-half">
        <div class="wordmark" style="display: block;">On the Radar</div>
        <p class="name-gate-tagline">Line up shows with your pals.</p>
        <form id="name-gate-form">
          <div class="form-row">
            <label for="name-gate-input">What's your name?</label>
            <input type="text" id="name-gate-input" required placeholder="Your name" autocomplete="name">
          </div>
          <button type="submit" class="btn-solid">Continue</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- ===== Header nav ===== -->
<!-- Wired to Supabase — real people/groups/memberships, no more mock
     data. This is the first of three components (header, body
     container, footer) building up on the frame. -->
<header class="site-header" id="site-header">
  <div class="container">
    <div class="row">
      <div class="col-half">
        <a href="index.html" class="wordmark">On the Radar</a>
      </div>
      <div class="col-half header-controls" style="justify-content: flex-end;">

        <div class="group-switch-wrap">
          <button class="group-switch" id="group-switch-btn">Loading…</button>
          <div class="group-menu" id="group-menu"></div>
        </div>

        <div class="avatar-stack">
          <div class="avatar-dots" id="avatar-dots"></div>
          <div class="avatar-list" id="avatar-list"></div>
        </div>

      </div>
    </div>
  </div>
</header>

<!-- ===== Body container ===== -->
<!-- Show cards for the current group's shows — real data, wired to
     Supabase. Curious/going/out buttons write to the responses table
     immediately on click. Overlap count only counts curious + going. -->
<main class="container show-list" id="main-content">
  <div class="show-list-header">
    <div class="view-toggle" id="view-toggle" style="display:none;">
      <button type="button" class="view-toggle-btn active" data-view="list">List</button>
      <button type="button" class="view-toggle-btn" data-view="calendar">Calendar</button>
    </div>
    <button type="button" id="add-show-btn" class="btn-solid" style="display:none;">+ Add show</button>
  </div>

  <div id="add-show-panel" class="add-show-form" style="display:none;">

    <!-- Method 1: search by artist name (Ticketmaster, New England) -->
    <div class="form-row" id="search-method-row">
      <label for="artist-search-input">Search artist</label>
      <div class="inline-input-row">
        <input type="text" id="artist-search-input" placeholder="Artist or show name">
        <button type="button" id="artist-search-btn" class="btn-solid">Search</button>
      </div>
      <div id="artist-search-status" class="autofill-status"></div>
      <div id="artist-search-results" class="search-results" style="display:none;"></div>
    </div>

    <div class="add-show-alt-methods">
      <button type="button" id="show-link-method-btn" class="link-btn">or paste a link</button>
      <button type="button" id="show-manual-method-btn" class="link-btn">or add manually</button>
    </div>

    <!-- Method 2: paste a link, autofill via server-side scrape -->
    <div class="form-row" id="link-method-row" style="display:none;">
      <label for="show-link-input">Show link</label>
      <div class="inline-input-row">
        <input type="url" id="show-link-input" placeholder="https://…">
        <button type="button" id="link-autofill-btn" class="btn-solid">Autofill</button>
      </div>
      <div id="link-autofill-status" class="autofill-status"></div>
    </div>

    <!-- Method 3: manual fields — also the fallback when search/link
         autofill doesn't return a usable title+date. When it does,
         the show gets created straight from that data with no form
         shown at all (see submitShowDirectly in the script below). -->
    <form id="add-show-form" style="display:none;">
      <div class="form-row">
        <label for="show-title">Show</label>
        <input type="text" id="show-title" required placeholder="Artist / show title">
      </div>
      <div class="form-row">
        <label for="show-date-input">Date</label>
        <input type="date" id="show-date-input" required>
      </div>
      <div class="form-row">
        <label for="show-venue-name">Venue</label>
        <input type="text" id="show-venue-name" placeholder="Venue name" autocomplete="off">
        <div id="venue-search-results" class="search-results" style="display:none;"></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-solid">Add show</button>
        <button type="button" id="cancel-add-show" class="btn-outline">Cancel</button>
      </div>
    </form>

  </div>

  <div id="show-list-content" class="show-list-empty">Loading…</div>

  <div id="calendar-view" style="display:none;">
    <div class="calendar-nav">
      <button type="button" id="calendar-prev" class="calendar-nav-btn">‹</button>
      <div class="calendar-month-label" id="calendar-month-label"></div>
      <button type="button" id="calendar-next" class="calendar-nav-btn">›</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <!-- Show detail — reached from a "View details" link on a list card
       or by tapping a calendar bubble (calendar cells are too small to
       hold the full response control, so this is where that lives). -->
  <div id="show-detail-view" style="display:none;">
    <button type="button" id="show-detail-back" class="link-btn" style="margin-bottom: var(--space-16);">‹ Back</button>
    <div class="show-card" id="show-detail-card"></div>
  </div>
</main>

<!-- ===== Footer — next up ===== -->

<!-- Plain scripts, not modules — see supabase/client.js for why.
     Load order matters: client.js defines OTR.db before identity.js
     and shows.js use it. -->
<script src="supabase/client.js"></script>
<script src="scripts/identity.js"></script>
<script src="scripts/shows.js"></script>
<script>
  const { getPerson, createPerson, getMyGroups, getGroupMembers, createGroup, getGroupBySlug, joinGroup } = OTR;
  const { getShowsForGroup, getResponsesForShows, overlapCount, setResponse, createShow, parseShowLink, searchShows, searchVenues } = OTR;

  const nameGate = document.getElementById('name-gate');
  const nameGateForm = document.getElementById('name-gate-form');
  const siteHeader = document.getElementById('site-header');
  const mainContent = document.getElementById('main-content');

  const viewToggle = document.getElementById('view-toggle');
  const listContent = document.getElementById('show-list-content');
  const calendarView = document.getElementById('calendar-view');
  const calendarPrevBtn = document.getElementById('calendar-prev');
  const calendarNextBtn = document.getElementById('calendar-next');

  const showDetailView = document.getElementById('show-detail-view');
  const showDetailBackBtn = document.getElementById('show-detail-back');
  const showDetailCard = document.getElementById('show-detail-card');

  const switchBtn = document.getElementById('group-switch-btn');
  const groupMenu = document.getElementById('group-menu');
  const avatarDots = document.getElementById('avatar-dots');
  const avatarList = document.getElementById('avatar-list');
  const addShowBtn = document.getElementById('add-show-btn');
  const addShowPanel = document.getElementById('add-show-panel');
  const addShowForm = document.getElementById('add-show-form');
  const cancelAddShow = document.getElementById('cancel-add-show');

  const artistSearchInput = document.getElementById('artist-search-input');
  const artistSearchBtn = document.getElementById('artist-search-btn');
  const artistSearchStatus = document.getElementById('artist-search-status');
  const artistSearchResults = document.getElementById('artist-search-results');

  const showLinkMethodBtn = document.getElementById('show-link-method-btn');
  const showManualMethodBtn = document.getElementById('show-manual-method-btn');
  const linkMethodRow = document.getElementById('link-method-row');
  const showLinkInput = document.getElementById('show-link-input');
  const linkAutofillBtn = document.getElementById('link-autofill-btn');
  const linkAutofillStatus = document.getElementById('link-autofill-status');

  const venueNameInput = document.getElementById('show-venue-name');
  const venueSearchResults = document.getElementById('venue-search-results');

  let currentGroupId = null;
  let selectedVenueUrl = null;
  let selectedSourceUrl = null;
  let venueSearchTimer = null;
  let viewMode = 'list';
  let calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

  function initials(name) {
    return name.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  // Self-contained avatar stack: dots that expand to a plain name list.
  // Used in the header (whole crew) and on each show card (who's in).
  // Each instance manages its own open/closed state via closure, so
  // multiple stacks on the page don't collide.
  function buildAvatarStack(people) {
    const wrap = document.createElement('div');
    wrap.className = 'avatar-stack';

    const dots = document.createElement('div');
    dots.className = 'avatar-dots';
    const list = document.createElement('div');
    list.className = 'avatar-list';

    people.forEach((p) => {
      const dot = document.createElement('div');
      dot.className = 'avatar-dot';
      dot.textContent = initials(p.display_name);
      dots.appendChild(dot);

      const item = document.createElement('div');
      item.textContent = p.display_name;
      list.appendChild(item);
    });

    dots.addEventListener('click', (e) => {
      e.stopPropagation();
      list.classList.toggle('open');
    });

    wrap.appendChild(dots);
    wrap.appendChild(list);
    return wrap;
  }

  function renderGroupMenu(groups, currentGroup) {
    groupMenu.innerHTML = '';
    groups.forEach(g => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = g.name;
      btn.addEventListener('click', () => selectGroup(g));
      groupMenu.appendChild(btn);
    });

    if (groups.length > 0) {
      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.textContent = 'Copy invite link';
      copyBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const current = groups.find((g) => g.id === currentGroupId) || groups[0];
        const link = `${window.location.origin}${window.location.pathname}?g=${current.slug}`;
        try {
          await navigator.clipboard.writeText(link);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy invite link'; }, 1500);
        } catch {
          // Clipboard API needs a secure context (https, or localhost —
          // not file://). Fall back to a prompt so it's still copyable.
          window.prompt('Copy this invite link:', link);
        }
      });
      groupMenu.appendChild(copyBtn);
    }

    const newBtn = document.createElement('button');
    newBtn.type = 'button';
    newBtn.textContent = '+ New group';
    newBtn.addEventListener('click', handleNewGroup);
    groupMenu.appendChild(newBtn);
  }

  async function renderAvatars(groupId) {
    const members = await getGroupMembers(groupId);
    avatarDots.innerHTML = '';
    avatarList.innerHTML = '';
    members.forEach(p => {
      const dot = document.createElement('div');
      dot.className = 'avatar-dot';
      dot.textContent = initials(p.display_name);
      avatarDots.appendChild(dot);

      const item = document.createElement('div');
      item.textContent = p.display_name;
      avatarList.appendChild(item);
    });
  }

  async function selectGroup(group) {
    switchBtn.textContent = `${group.name} ▾`;
    groupMenu.classList.remove('open');
    currentGroupId = group.id;
    addShowBtn.style.display = 'inline-block';
    viewToggle.style.display = 'inline-flex';
    await renderAvatars(group.id);
    await renderCurrentView(group.id);
  }

  let person = null;

  function formatDate(dateStr, timeStr) {
    const d = new Date(`${dateStr}T${timeStr || '00:00'}`);
    const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
    if (!timeStr) return date;
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return `${date} · ${time}`;
  }

  // Fetches once, both views render from the same data — keeps List
  // and Calendar guaranteed in sync regardless of which is showing.
  async function loadGroupData(groupId) {
    const shows = await getShowsForGroup(groupId);
    const showIds = shows.map((s) => s.id);
    const responsesByShow = await getResponsesForShows(showIds);
    return { shows, responsesByShow };
  }

  async function renderCurrentView(groupId) {
    const { shows, responsesByShow } = await loadGroupData(groupId);
    if (viewMode === 'calendar') {
      renderCalendarView(shows, responsesByShow);
    } else {
      renderListView(shows, responsesByShow);
    }
  }

  // Shared between the list card and the show detail view — title,
  // venue, openers, who's-in avatars, and the response control. Kept
  // in one place so the two surfaces can't drift apart.
  function renderShowInteractiveBody(container, show, responses, onResponseChange) {
    const mine = responses.find((r) => r.person_id === person.id);
    const interested = responses.filter((r) => r.status === 'curious' || r.status === 'going');

    container.innerHTML = `
      <div class="show-title">${show.source_url ? `<a href="${show.source_url}" target="_blank" rel="noopener">${show.title}</a>` : show.title}</div>
      ${show.venue_name ? `<div class="show-venue">${show.venue_url ? `<a href="${show.venue_url}" target="_blank" rel="noopener">${show.venue_name}</a>` : show.venue_name}</div>` : ''}
      ${show.openers ? `<div class="show-openers">with ${show.openers}</div>` : ''}
    `;

    if (interested.length > 0) {
      const avatarRow = document.createElement('div');
      avatarRow.className = 'show-card-avatars';
      avatarRow.appendChild(buildAvatarStack(interested.map((r) => r.people)));
      container.appendChild(avatarRow);
    }

    const responseRow = document.createElement('div');
    responseRow.className = 'show-responses';

    [['curious', 'Curious'], ['going', 'Got tickets'], ['out', "I'm out"]].forEach(([status, label]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'resp-btn';
      btn.dataset.status = status;
      btn.textContent = label;
      if (mine && mine.status === status) btn.classList.add('active');
      btn.addEventListener('click', async () => {
        const ok = await setResponse(show.id, person.id, status);
        if (ok) await onResponseChange();
      });
      responseRow.appendChild(btn);
    });

    container.appendChild(responseRow);
  }

  function renderListView(shows, responsesByShow) {
    const content = listContent;

    if (shows.length === 0) {
      content.className = 'show-list-empty';
      content.textContent = 'No shows yet.';
      return;
    }

    content.className = '';
    content.innerHTML = '';

    shows.forEach((show) => {
      const responses = responsesByShow[show.id] || [];
      const mine = responses.find((r) => r.person_id === person.id);
      const overlap = overlapCount(responses);

      const card = document.createElement('div');
      card.className = 'show-card';
      if (mine && mine.status === 'out') card.classList.add('is-out');

      const top = document.createElement('div');
      top.className = 'show-card-top';
      const dateEl = document.createElement('div');
      dateEl.className = 'show-date';
      dateEl.textContent = formatDate(show.show_date, show.show_time);
      top.appendChild(dateEl);
      if (overlap >= 2) {
        const badge = document.createElement('div');
        badge.className = 'show-overlap';
        badge.textContent = `${overlap} overlap`;
        top.appendChild(badge);
      }
      card.appendChild(top);

      const body = document.createElement('div');
      card.appendChild(body);
      renderShowInteractiveBody(body, show, responses, () => renderCurrentView(currentGroupId));

      const detailBtn = document.createElement('button');
      detailBtn.type = 'button';
      detailBtn.className = 'link-btn show-detail-link';
      detailBtn.textContent = 'View details';
      detailBtn.addEventListener('click', () => openShowDetail(show.id));
      card.appendChild(detailBtn);

      content.appendChild(card);
    });
  }

  // Formats show_time ("19:30:00") down to something that fits a
  // calendar cell — "7:30 PM" rather than a full date+time string.
  function formatTimeShort(timeStr) {
    const d = new Date(`2000-01-01T${timeStr}`);
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  async function openShowDetail(showId) {
    if (!currentGroupId) return;
    const { shows, responsesByShow } = await loadGroupData(currentGroupId);
    const show = shows.find((s) => s.id === showId);
    if (!show) return;

    viewToggle.style.display = 'none';
    addShowBtn.style.display = 'none';
    listContent.style.display = 'none';
    calendarView.style.display = 'none';
    showDetailView.style.display = 'block';

    renderShowDetail(show, responsesByShow[show.id] || []);
  }

  function renderShowDetail(show, responses) {
    const mine = responses.find((r) => r.person_id === person.id);
    const overlap = overlapCount(responses);

    showDetailCard.className = 'show-card';
    if (mine && mine.status === 'out') showDetailCard.classList.add('is-out');
    showDetailCard.innerHTML = '';

    const top = document.createElement('div');
    top.className = 'show-card-top';
    const dateEl = document.createElement('div');
    dateEl.className = 'show-date';
    dateEl.textContent = formatDate(show.show_date, show.show_time);
    top.appendChild(dateEl);
    if (overlap >= 2) {
      const badge = document.createElement('div');
      badge.className = 'show-overlap';
      badge.textContent = `${overlap} overlap`;
      top.appendChild(badge);
    }
    showDetailCard.appendChild(top);

    const body = document.createElement('div');
    showDetailCard.appendChild(body);

    renderShowInteractiveBody(body, show, responses, async () => {
      const { shows, responsesByShow } = await loadGroupData(currentGroupId);
      const updated = shows.find((s) => s.id === show.id);
      if (updated) renderShowDetail(updated, responsesByShow[updated.id] || []);
    });
  }

  function closeShowDetail() {
    showDetailView.style.display = 'none';
    viewToggle.style.display = 'inline-flex';
    addShowBtn.style.display = 'inline-block';
    listContent.style.display = viewMode === 'list' ? '' : 'none';
    calendarView.style.display = viewMode === 'calendar' ? 'block' : 'none';
  }

  showDetailBackBtn.addEventListener('click', closeShowDetail);

  const CALENDAR_WEEKDAYS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const CALENDAR_MAX_VISIBLE = 2;

  function renderCalendarView(shows, responsesByShow) {
    const grid = document.getElementById('calendar-grid');
    const label = document.getElementById('calendar-month-label');

    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    label.textContent = calendarMonth
      .toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
      .toUpperCase();

    const showsByDate = {};
    shows.forEach((show) => {
      if (!showsByDate[show.show_date]) showsByDate[show.show_date] = [];
      showsByDate[show.show_date].push(show);
    });

    grid.innerHTML = '';
    CALENDAR_WEEKDAYS.forEach((wd) => {
      const cell = document.createElement('div');
      cell.className = 'calendar-weekday';
      cell.textContent = wd;
      grid.appendChild(cell);
    });

    const firstOfMonth = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startWeekday = firstOfMonth.getDay();

    for (let i = 0; i < startWeekday; i++) {
      const blank = document.createElement('div');
      blank.className = 'calendar-day is-empty';
      grid.appendChild(blank);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const cell = document.createElement('div');
      cell.className = 'calendar-day';

      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

      const num = document.createElement('div');
      num.className = 'calendar-day-number';
      num.textContent = day;
      cell.appendChild(num);

      const dayShows = showsByDate[dateStr] || [];

      dayShows.slice(0, CALENDAR_MAX_VISIBLE).forEach((show) => {
        const responses = responsesByShow[show.id] || [];
        const overlap = overlapCount(responses);

        // Bubble = something's happening (Google/Apple-calendar style),
        // not the full title — the title lives on the detail page a
        // tap away, since a cell this small can't hold it legibly.
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'calendar-show' + (overlap >= 2 ? ' has-overlap' : '');
        row.innerHTML = `<span class="calendar-show-dot"></span><span class="calendar-show-label">${show.show_time ? formatTimeShort(show.show_time) : show.title}</span>`;
        row.addEventListener('click', () => openShowDetail(show.id));
        cell.appendChild(row);
      });

      if (dayShows.length > CALENDAR_MAX_VISIBLE) {
        const more = document.createElement('div');
        more.className = 'calendar-more';
        more.textContent = `+${dayShows.length - CALENDAR_MAX_VISIBLE} more`;
        cell.appendChild(more);
      }

      grid.appendChild(cell);
    }

    const totalCells = startWeekday + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 0; i < trailing; i++) {
      const blank = document.createElement('div');
      blank.className = 'calendar-day is-empty';
      grid.appendChild(blank);
    }
  }

  viewToggle.querySelectorAll('.view-toggle-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      viewMode = btn.dataset.view;
      viewToggle.querySelectorAll('.view-toggle-btn').forEach((b) => b.classList.toggle('active', b === btn));
      listContent.style.display = viewMode === 'list' ? '' : 'none';
      calendarView.style.display = viewMode === 'calendar' ? 'block' : 'none';
      if (currentGroupId) await renderCurrentView(currentGroupId);
    });
  });

  calendarPrevBtn.addEventListener('click', async () => {
    calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1);
    if (currentGroupId) await renderCurrentView(currentGroupId);
  });

  calendarNextBtn.addEventListener('click', async () => {
    calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1);
    if (currentGroupId) await renderCurrentView(currentGroupId);
  });

  async function handleNewGroup() {
    groupMenu.classList.remove('open');
    const name = window.prompt('Name this group:', '')?.trim();
    if (!name) return;
    const group = await createGroup(person.id, name);
    if (!group) return;
    const groups = await getMyGroups(person.id);
    renderGroupMenu(groups, group);
    await selectGroup(group);
  }

  // Processes ?g=<slug> from a shared invite link: looks up the group
  // and adds the person to it. Safe to no-op (bad slug, no param, or
  // already a member) — the URL param is cleaned up either way so a
  // page refresh doesn't keep re-processing it.
  async function handleGroupJoinFromUrl(personId) {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('g');
    if (!slug) return null;

    window.history.replaceState({}, '', window.location.pathname);

    const group = await getGroupBySlug(slug);
    if (!group) return null;

    await joinGroup(personId, group.id);
    return group;
  }

  async function afterPerson() {
    const joinedGroup = await handleGroupJoinFromUrl(person.id);
    const groups = await getMyGroups(person.id);

    if (groups.length === 0) {
      switchBtn.textContent = 'No groups yet ▾';
      renderGroupMenu([], null);
      document.getElementById('show-list-content').textContent = 'Create a group to start adding shows.';
      return;
    }

    const targetGroup = groups.find((g) => g.id === joinedGroup?.id) || groups[0];
    renderGroupMenu(groups, targetGroup);
    await selectGroup(targetGroup);
  }

  async function init() {
    person = await getPerson();

    if (!person) {
      siteHeader.style.display = 'none';
      mainContent.style.display = 'none';
      nameGate.style.display = 'block';
      return;
    }

    await afterPerson();
  }

  nameGateForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name-gate-input').value.trim();
    if (!name) return;

    person = await createPerson(name);
    if (!person) return;

    nameGate.style.display = 'none';
    siteHeader.style.display = '';
    mainContent.style.display = '';
    await afterPerson();
  });

  init();

  // Menu toggling
  switchBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    groupMenu.classList.toggle('open');
  });
  avatarDots.addEventListener('click', (e) => {
    e.stopPropagation();
    avatarList.classList.toggle('open');
  });
  // Closes every open menu/avatar-list on the page, not just the
  // header's — show cards each have their own avatar stack now.
  document.addEventListener('click', () => {
    groupMenu.classList.remove('open');
    document.querySelectorAll('.avatar-list.open').forEach((el) => el.classList.remove('open'));
  });

  // ===== Add show: three entry methods (search, link, manual), all
  // funneling into the same manual form for review before submit. =====

  function resetAddShowPanel() {
    addShowForm.reset();
    addShowForm.style.display = 'none';

    artistSearchInput.value = '';
    artistSearchStatus.textContent = '';
    artistSearchResults.innerHTML = '';
    artistSearchResults.style.display = 'none';

    showLinkInput.value = '';
    linkAutofillStatus.textContent = '';
    linkMethodRow.style.display = 'none';

    venueSearchResults.innerHTML = '';
    venueSearchResults.style.display = 'none';
    selectedVenueUrl = null;
    selectedSourceUrl = null;

    document.getElementById('search-method-row').style.display = 'block';

    addShowPanel.style.display = 'none';
    addShowBtn.style.display = 'inline-block';
  }

  function revealManualForm(prefill) {
    document.getElementById('show-title').value = prefill?.title || '';
    document.getElementById('show-date-input').value = prefill?.show_date || '';
    venueNameInput.value = prefill?.venue_name || '';
    selectedVenueUrl = prefill?.venue_url || null;
    selectedSourceUrl = prefill?.source_url || null;
    addShowForm.style.display = 'block';
    addShowForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Used when search or link autofill already has enough to create the
  // show outright (title + date) — no review form, just add it. Falls
  // back to the form if the data turns out to be incomplete.
  async function submitShowDirectly(fields) {
    if (!currentGroupId) return;
    if (!fields.title || !fields.show_date) {
      revealManualForm(fields);
      return;
    }
    const show = await createShow(currentGroupId, person.id, fields);
    if (show) {
      resetAddShowPanel();
      await renderCurrentView(currentGroupId);
    }
  }

  addShowBtn.addEventListener('click', () => {
    addShowPanel.style.display = 'block';
    addShowBtn.style.display = 'none';
  });

  cancelAddShow.addEventListener('click', resetAddShowPanel);

  // Method switching
  showLinkMethodBtn.addEventListener('click', () => {
    document.getElementById('search-method-row').style.display = 'none';
    linkMethodRow.style.display = 'block';
  });

  showManualMethodBtn.addEventListener('click', () => {
    revealManualForm(null);
  });

  // Method 1: artist search (Ticketmaster, New England)
  artistSearchBtn.addEventListener('click', async () => {
    const keyword = artistSearchInput.value.trim();
    if (!keyword) return;

    artistSearchStatus.textContent = 'Searching…';
    artistSearchResults.style.display = 'none';
    artistSearchResults.innerHTML = '';

    const results = await searchShows(keyword);

    if (results.length === 0) {
      artistSearchStatus.textContent = 'No shows found — try a link or add manually.';
      return;
    }

    artistSearchStatus.textContent = `${results.length} show${results.length === 1 ? '' : 's'} found`;
    artistSearchResults.style.display = 'block';

    results.forEach((show) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'search-result-item';
      item.innerHTML = `
        <div class="result-title">${show.title || 'Untitled show'}</div>
        <div class="result-meta">${show.show_date || 'No date'}${show.venue_name ? ' · ' + show.venue_name : ''}</div>
      `;
      item.addEventListener('click', () => submitShowDirectly(show));
      artistSearchResults.appendChild(item);
    });
  });

  // Method 2: paste a link, autofill via server-side scrape. A usable
  // result (title + date) gets added straight away; anything less
  // falls back to the manual form with whatever was found pre-filled.
  linkAutofillBtn.addEventListener('click', async () => {
    const url = showLinkInput.value.trim();
    if (!url) return;

    linkAutofillStatus.textContent = 'Reading link…';
    const result = await parseShowLink(url);
    // source_url (the show's own ticket page) is always the pasted
    // link itself; venue_url stays whatever the page's own structured
    // data said (a real venue site), or nothing — the two aren't the
    // same thing, so don't collapse one into the other.
    const fields = { ...result, source_url: result.source_url || url };

    if (fields.title && fields.show_date) {
      await submitShowDirectly(fields);
    } else {
      linkAutofillStatus.textContent = "Couldn't read that link — add the details manually below.";
      revealManualForm(fields);
    }
  });

  // Venue-name autocomplete — debounced lookup against Ticketmaster's
  // venue directory. Picking a suggestion silently attaches its venue
  // link; there's no visible link field for it to appear in.
  venueNameInput.addEventListener('input', () => {
    selectedVenueUrl = null;
    clearTimeout(venueSearchTimer);

    const keyword = venueNameInput.value.trim();
    if (keyword.length < 3) {
      venueSearchResults.style.display = 'none';
      venueSearchResults.innerHTML = '';
      return;
    }

    venueSearchTimer = setTimeout(async () => {
      const venues = await searchVenues(keyword);
      venueSearchResults.innerHTML = '';

      if (venues.length === 0) {
        venueSearchResults.style.display = 'none';
        return;
      }

      venues.forEach((v) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'search-result-item';
        item.innerHTML = `
          <div class="result-title">${v.name}</div>
          ${v.city ? `<div class="result-meta">${v.city}</div>` : ''}
        `;
        item.addEventListener('click', () => {
          venueNameInput.value = v.name;
          selectedVenueUrl = v.url;
          venueSearchResults.style.display = 'none';
          venueSearchResults.innerHTML = '';
        });
        venueSearchResults.appendChild(item);
      });

      venueSearchResults.style.display = 'block';
    }, 300);
  });

  // Method 3: manual submit — used for plain manual entry, and as the
  // fallback when search/link autofill didn't have enough to add the
  // show outright.
  addShowForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fields = {
      title: document.getElementById('show-title').value.trim(),
      show_date: document.getElementById('show-date-input').value,
      venue_name: venueNameInput.value.trim(),
      venue_url: selectedVenueUrl,
      source_url: selectedSourceUrl,
    };
    await submitShowDirectly(fields);
  });
</script>

</body>
</html>
